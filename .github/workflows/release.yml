name: Release

# Tag-triggered ONLY. Ordinary pushes/PRs never build a release, so you can't
# "burn a release" by mistake. Cut one with:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release and upload assets

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  # Android: build + sign a release APK and AAB, attach to the GitHub Release.
  # Requires the four ANDROID_* repo secrets (see docs/getting-started/
  # ci-and-releases.md). Fully self-serve; no third-party account needed.
  release-android:
    name: Build & sign Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Flutter version matches .tool-versions
        run: |
          pinned=$(sed -n 's/^flutter \([0-9.]*\).*/\1/p' .tool-versions)
          if [ "$pinned" != "$FLUTTER_VERSION" ]; then
            echo "::error::.tool-versions pins Flutter $pinned but env.FLUTTER_VERSION is $FLUTTER_VERSION. Update both to match (.tool-versions is the source of truth)."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # No caching: release artifacts must be built clean every time so a
          # stale Gradle/pub cache can't ship a bad or unreproducible build.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Materialize keystore + key.properties from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set - cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/dvma-release.jks
          cat > android/app/key.properties <<EOF
          storeFile=dvma-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APK
        run: flutter build apk --release

      - name: Build signed App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Scrub signing material
        if: always()
        run: rm -f android/app/dvma-release.jks android/app/key.properties

      - name: Upload artifacts to the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  # iOS: build + sign a distributable .ipa. Auto-SKIPS when the Apple secrets
  # are absent, so this workflow never hard-fails before you have a paid Apple
  # Developer account and its cert/profile. See ci-and-releases.md.
  release-ios:
    name: Build & sign iOS (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for Apple signing secrets
        id: gate
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
        run: |
          if [ -z "$CERT" ]; then
            echo "have_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS signing secrets absent - publishing an UNSIGNED .ipa. Users re-sign it for their own device (see docs/getting-started/ci-and-releases.md, 'The re-sign path'). Add IOS_* secrets + a paid Apple Developer account for a pre-signed .ipa."
          else
            echo "have_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # No caching: release artifacts must be built clean every time so a
          # stale Gradle/pub cache can't ship a bad or unreproducible build.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Import signing certificate into a temp keychain
        if: steps.gate.outputs.have_secrets == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12

      - name: Install provisioning profile
        if: steps.gate.outputs.have_secrets == 'true'
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/dvma.mobileprovision

      - name: Generate ExportOptions.plist from IOS_TEAM_ID secret
        if: steps.gate.outputs.have_secrets == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }} # optional; defaults to development
        run: |
          if [ -z "$IOS_TEAM_ID" ]; then
            echo "::error::IOS_TEAM_ID secret is not set - cannot export a signed IPA."
            exit 1
          fi
          METHOD="${IOS_EXPORT_METHOD:-development}"
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${METHOD}</string>
              <key>teamID</key>
              <string>${IOS_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Build signed IPA
        if: steps.gate.outputs.have_secrets == 'true'
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Build UNSIGNED IPA (no Apple secrets - users re-sign locally)
        if: steps.gate.outputs.have_secrets == 'false'
        run: |
          flutter build ios --release --no-codesign
          APP_DIR="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::$APP_DIR not found - unsigned build failed."
            exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_DIR" build/ios/ipa/Payload/
          ( cd build/ios/ipa && zip -qr Runner-unsigned.ipa Payload && rm -rf Payload )
          echo "Packaged unsigned IPA: build/ios/ipa/Runner-unsigned.ipa"

      - name: Clean up keychain
        if: always() && steps.gate.outputs.have_secrets == 'true'
        run: |
          security delete-keychain build.keychain || true
          rm -f ios/ExportOptions.plist

      - name: Upload IPA to the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: build/ios/ipa/*.ipa
