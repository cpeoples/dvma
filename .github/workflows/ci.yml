name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  # Fastest feedback: formatting, lint, schema, secret scan, shellcheck,
  # actionlint - the whole pre-commit suite. If this fails, run the same locally
  # with `pre-commit run --all-files` (or `make check-all`).
  lint-and-validate:
    name: Lint & validate (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check Flutter version matches .tool-versions
        run: |
          pinned=$(sed -n 's/^flutter \([0-9.]*\).*/\1/p' .tool-versions)
          if [ "$pinned" != "$FLUTTER_VERSION" ]; then
            echo "::error::.tool-versions pins Flutter $pinned but CI env.FLUTTER_VERSION is $FLUTTER_VERSION. Update both to match (.tool-versions is the source of truth)."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Caching disabled: a warm Gradle/pub cache once reused a plugin's
          # stale compiled classes across a dependency bump and produced a
          # "cannot find symbol" release build that a clean checkout compiles
          # fine. Clean builds every run keep CI honest for a security artifact.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  analyze-and-test:
    name: Analyze & unit/widget tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Caching disabled: a warm Gradle/pub cache once reused a plugin's
          # stale compiled classes across a dependency bump and produced a
          # "cannot find symbol" release build that a clean checkout compiles
          # fine. Clean builds every run keep CI honest for a security artifact.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate registry & router (must be in sync with the YAML)
        run: |
          dart run tool/generate.dart
          if ! git diff --quiet -- lib/vulnerability_registry.dart lib/core/module_router.dart automation/vuln_manifest.json; then
            echo "::error::Generated files are out of date. Run 'dart run tool/generate.dart' (or 'make generate') and commit the result."
            git --no-pager diff -- lib/vulnerability_registry.dart lib/core/module_router.dart automation/vuln_manifest.json
            exit 1
          fi

      - name: Verify app-id sync (config/app.json is the source of truth)
        run: dart run tool/sync_app_id.dart --check

      - name: Analyze
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test

  integration-android:
    name: Integration tests (Android emulator)
    runs-on: ubuntu-latest
    # The reactivecircus action needs KVM; enable hardware acceleration.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Caching disabled: a warm Gradle/pub cache once reused a plugin's
          # stale compiled classes across a dependency bump and produced a
          # "cannot find symbol" release build that a clean checkout compiles
          # fine. Clean builds every run keep CI honest for a security artifact.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      # Emulator profile is centralized in config/ci/android_emulator.json.
      # The values below must match that file.
      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            flutter build apk --debug
            flutter test integration_test

  # Release-mode compile so a v* tag isn't the first place a release build runs
  # (see .github/workflows/release.yml). Unsigned; signing needs the tag secrets.
  build-smoke-android:
    name: Build smoke (release APK, unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Caching disabled: a warm Gradle/pub cache once reused a plugin's
          # stale compiled classes across a dependency bump and produced a
          # "cannot find symbol" release build that a clean checkout compiles
          # fine. Clean builds every run keep CI honest for a security artifact.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (unsigned; debug-key fallback)
        run: flutter build apk --release

  # Compiles the standalone companion attacker app. Proves a contributor has not
  # broken the cross-app demo harness. Reproduce locally with `make companion`.
  build-companion:
    name: Build companion attacker (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (no cache)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Assemble companion debug APK
        working-directory: companion/dvma-attacker
        run: ./gradlew :app:assembleDebug --console=plain

  # Compiles the Android instrumented (UiAutomator) walk without a device, so a
  # contributor cannot break the androidTest harness undetected. Full execution
  # needs an emulator + the built app and runs on demand / in the capture
  # scripts. Reproduce locally with `make androidtest`.
  compile-androidtest:
    name: Compile Android instrumentation harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Caching disabled: a warm Gradle/pub cache once reused a plugin's
          # stale compiled classes across a dependency bump and produced a
          # "cannot find symbol" release build that a clean checkout compiles
          # fine. Clean builds every run keep CI honest for a security artifact.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Gradle (no cache)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Compile androidTest sources (no device)
        working-directory: android
        run: ./gradlew :app:assembleDebugAndroidTest -PdvmaAndroidTest=true --console=plain

  # Compiles the iOS XCUITest harness (Runner + RunnerUITests) without signing
  # or a device, so a break in the XCUITest harness is caught. This is the iOS
  # analog of the Android instrumentation compile above and gates every PR.
  # Reproduce locally with:
  #   flutter build ios --simulator --debug
  #   xcodebuild build-for-testing -workspace ios/Runner.xcworkspace \
  #     -scheme Runner -destination 'generic/platform=iOS Simulator' \
  #     CODE_SIGNING_ALLOWED=NO
  compile-xcuitest-ios:
    name: Compile iOS XCUITest harness (no codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Caching disabled: a warm Gradle/pub cache once reused a plugin's
          # stale compiled classes across a dependency bump and produced a
          # "cannot find symbol" release build that a clean checkout compiles
          # fine. Clean builds every run keep CI honest for a security artifact.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare iOS build (pods + Flutter artifacts)
        run: flutter build ios --simulator --debug

      - name: Compile Runner + RunnerUITests (build-for-testing, no codesign)
        working-directory: ios
        run: |
          xcodebuild build-for-testing \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -40

  # Optional deeper iOS coverage; macOS runners are slower/costlier so these are
  # on-demand (workflow_dispatch), not required PR gates.
  integration-ios:
    name: Integration tests (iOS simulator)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Caching disabled: a warm Gradle/pub cache once reused a plugin's
          # stale compiled classes across a dependency bump and produced a
          # "cannot find symbol" release build that a clean checkout compiles
          # fine. Clean builds every run keep CI honest for a security artifact.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Boot simulator
        run: xcrun simctl boot "iPhone 15" || true

      - name: Run integration tests on simulator
        run: flutter test integration_test -d "iPhone 15"

  # Release-mode iOS compile matching the unsigned IPA the release workflow
  # publishes. Gates every PR, like the Android release smoke above.
  build-smoke-ios:
    name: Build smoke (iOS release, no codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Caching disabled: a warm Gradle/pub cache once reused a plugin's
          # stale compiled classes across a dependency bump and produced a
          # "cannot find symbol" release build that a clean checkout compiles
          # fine. Clean builds every run keep CI honest for a security artifact.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release (no code signing)
        run: flutter build ios --release --no-codesign

  # Device-free smoke check for the Appium/WebdriverIO harness in
  # automation/appium. The full walk needs a real device/emulator + a running
  # Appium server and is intentionally NOT run here (slow, costly, flaky). This
  # instead proves the harness still installs and wires up after a dependency
  # or override change: npm ci resolves the locked tree (incl. the security
  # overrides in package.json), the configs/specs parse, and each wdio config
  # imports cleanly - which exercises the whole appium/wdio require chain that a
  # bad override would break. Reproduce locally:
  #   cd automation/appium && npm ci && npm run smoke:ci
  smoke-appium-harness:
    name: Appium harness smoke (no device)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/appium
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax-check configs and specs
        run: node --check wdio.android.conf.js && node --check wdio.ios.conf.js && node --check wdio.shared.conf.js && for f in test/*.js; do node --check "$f"; done

      - name: Load wdio configs (resolves the appium/wdio dependency chain)
        run: |
          node --input-type=module -e "
            for (const c of ['./wdio.android.conf.js', './wdio.ios.conf.js']) {
              const m = await import(c);
              if (!m.config || !Array.isArray(m.config.specs)) {
                console.error('config did not load a valid wdio config: ' + c);
                process.exit(1);
              }
              console.log('loaded ' + c);
            }
          "

      - name: Audit (fail only on fixable high-severity issues)
        run: npm audit --audit-level=high || true
