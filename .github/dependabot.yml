# Dependabot keeps dependencies and pinned GitHub Actions current via PRs.
# GitHub Actions is the priority: it bumps the SHA pins (and their version
# comments) in .github/workflows/, closing the supply-chain gap that SHA-pinning
# opens (stale pins). App/tooling ecosystems run monthly and grouped to keep the
# PR volume low; this is a training app, so dependency churn is not a goal.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      flutter-deps:
        patterns: ["*"]
    ignore:
      # Intentionally pinned behind the latest release: the vulnerable_dependencies
      # training module (lib/modules/code_quality/vulnerable_dependencies/) teaches
      # that these two are kept a major version behind and flagged by
      # `dart pub outdated` / OSV-Scanner. Bumping them neutralizes that module and
      # desyncs its hardcoded version strings, so Dependabot must leave them alone.
      - dependency-name: dart_jsonwebtoken
      - dependency-name: app_links

  - package-ecosystem: npm
    directory: /automation/appium
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      appium-deps:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      android-deps:
        patterns: ["*"]
    ignore:
      # AGP/Kotlin are pinned in gradle/libs.versions.toml to what Flutter 3.47.2
      # supports. Bumping AGP past that range breaks the release APK copy step
      # (Flutter fails to move app-release.apk into flutter-apk/), so Dependabot
      # must leave the toolchain pins alone.
      - dependency-name: com.android.application
      - dependency-name: com.android.tools.build:gradle
      - dependency-name: org.jetbrains.kotlin.android
      - dependency-name: org.jetbrains.kotlin:*
      # The androidTest instrumentation deps are pinned to versions aligned with
      # what Flutter itself resolves (see gradle/libs.versions.toml). Dependabot
      # mis-bumps them as a group to versions that don't all exist on Maven (e.g.
      # androidx.test.ext:junit only reaches 1.3.x, not 1.7.x), producing an
      # unresolvable build. Keep them on the working, Flutter-aligned pins.
      - dependency-name: androidx.test:*
      - dependency-name: androidx.test.ext:*
      - dependency-name: androidx.test.espresso:*
      - dependency-name: androidx.test.uiautomator:*

  - package-ecosystem: gradle
    directory: /companion/dvma-attacker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      attacker-deps:
        patterns: ["*"]
    ignore:
      # Toolchain shared with the app via gradle/libs.versions.toml; keep AGP and
      # Kotlin aligned there rather than letting Dependabot drift the companion.
      - dependency-name: com.android.application
      - dependency-name: com.android.tools.build:gradle
      - dependency-name: org.jetbrains.kotlin.android
      - dependency-name: org.jetbrains.kotlin:*
