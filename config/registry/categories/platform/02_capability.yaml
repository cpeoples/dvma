    display_tags:
    - CWE-862
    - CWE-284
    - MASVS-PLATFORM-3
    tools:
    - Siri
    attack_inputs:
    - crafted shortcut
    summary: An App Intent surfaced to many system entry points (Siri, Spotlight, Shortcuts, Widget, Control, Live Activity, Action Button, Apple Intelligence) reaches a privileged operation with no per-surface authorization, so ANY of those externally-invocable surfaces can trigger the action - the surface fan-out widens the attack surface far beyond the app UI (Apple App Intents multi-surface capability-exposure class).
    manual_test: >-
      fire a privileged App Intent from a surface that shouldn't be allowed to
      (Widget/Control/Action Button) with no unlock and confirm it runs;
      verify the secure build enforces per-surface authorization + auth for
      sensitive intents (Apple App Intents multi-surface exposure class).
    detail: >-
      An App Intent is surfaced to many system entry points (Siri, Spotlight,
      Shortcuts, Widget, Control, Live Activity, Action Button, Apple
      Intelligence) and reaches a privileged operation ("export all data") with
      no per-surface authorization. A passive, lock-screen-reachable surface such
      as a Control therefore fires the privileged op with no unlock and no
      confirmation. This is the surface fan-out problem, distinct from
      untrusted-parameter authorization. This is an offline, deterministic
      simulation. The secure path enforces a per-surface allowlist and requires
      device authentication for sensitive intents.
    references:
    - 'Apple: App Intents (Siri / Spotlight / Widgets / Controls / Action Button / Apple Intelligence surfaces)|https://developer.apple.com/documentation/appintents'
  - id: cross_profile_data_capability_leakage
    platforms:
    - android
    title: Cross-Profile (Work/Personal) Data & Capability Leakage
    difficulty: hard
    masvs:
    - MASVS-PLATFORM-1
    - MASVS-STORAGE-1
    maswe:
    - MASWE-0032
    owasp_mobile: M4
    cwe:
    - CWE-200
    - CWE-668
    - CWE-863
    display_tags:
    - CWE-200
    - CWE-668
    - MASVS-PLATFORM-1
    tools:
    - adb
    - drozer
    - jadx
    attack_inputs:
    - cross-profile forwarding intent
    - malicious companion app
    summary: Managed (work) and primary (personal) profiles are a security boundary, but the app crosses it unsafely - forwarded intents, URI grants, shared files, notifications, clipboard, contacts, or account data move between profiles without the required affordance/authorization, so work data leaks to a personal surface (or vice-versa). This is a tenant-boundary violation on top of Android's cross-profile intent-forwarding machinery, distinct from ordinary intent redirection (Android managed-profile cross-profile leakage class).
    manual_test: >-
      forward a work-profile credential to a personal surface (share sheet /
      clipboard / intent) and confirm it crosses; verify the secure build
      enforces a cross-profile policy (only allowlisted, non-sensitive items
      may cross, with the required user affordance) so work data is blocked
      (Android managed-profile leakage class).
    detail: >-
      Work (managed) and personal (primary) profiles are a security boundary, but
      the app crosses it unsafely. A forwarded intent, URI grant, or shared item
      moves between profiles with no policy check and no required user affordance,
      so a work credential (a corporate VPN password) lands on a personal
      surface. This is a tenant-boundary violation on top of Android
      cross-profile intent-forwarding, distinct from ordinary intent redirection.
      This offline demo forwards an in-memory work credential to a personal share
      sheet. The secure path enforces a cross-profile policy, so only
      whitelisted, non-sensitive item types may cross with the required
      affordance, and the sensitive work credential is denied and never crosses.
    references:
    - 'Android CDD: cross-profile intent forwarding and managed-profile UI separation|https://source.android.com/docs/compatibility/16/android-16-cdd'
  - id: unauthenticated_local_loopback_service
    platforms:
    - android
    - ios
    platform_note: A loopback HTTP/TCP or unix-domain socket the app opens for its own components, reachable by other local apps / web content.
    title: Unauthenticated Local / Loopback Service
    difficulty: hard
    masvs:
    - MASVS-NETWORK-1
    - MASVS-PLATFORM-1
    maswe:
    - MASWE-0018
    owasp_mobile: M4
    cwe:
    - CWE-306
    - CWE-668
    - CWE-350
    display_tags:
    - CWE-306
    - CWE-668
    - MASVS-NETWORK-1
    tools:
    - mitmproxy
    - Burp Suite
    - adb
    - nc
    - tcpdump
    attack_inputs:
    - localhost request
    - DNS-rebinding page
    summary: The app opens a local HTTP/TCP or unix-domain socket (for IPC, a debug bridge, a companion SDK, or a WebView bridge) with no authentication, so any co-resident app - or remote web content via DNS rebinding against 127.0.0.1 - reaches privileged functionality or reads data on that port. The loopback service is treated as trusted merely because it is local. The secure path binds an unpredictable per-session token / origin check to every local request.
    manual_test: >-
      hit the app's loopback HTTP/TCP or unix-domain socket from a co-resident
      app or a DNS-rebinding web origin (no token) and confirm privileged
      data/functionality is served; verify the secure build requires a
      per-session token and validates the Origin/Host, rejecting rebinding +
      untokened callers.
    detail: >-
      The app opens a privileged service (an IPC, debug, or WebView bridge) on
      the loopback interface and trusts every caller simply because the socket is
      "only local". With no token and no Origin or Host check, a co-resident app
      can invoke privileged operations, and a remote web page can reach 127.0.0.1
      via DNS rebinding and read the app's secrets. This demo binds a real
      loopback HTTP server on 127.0.0.1 with no token or Origin check and issues
      an unauthenticated GET /getSecrets over the socket, recording the exposed
      response as a pullable artifact. The secure path requires an unpredictable
      per-session token and validates the Origin and Host, rejecting untokened
      and rebinding callers.
    references:
    - 'OWASP MASTG: local service exposure and DNS-rebinding against loopback|https://mas.owasp.org/MASTG/tests/'
