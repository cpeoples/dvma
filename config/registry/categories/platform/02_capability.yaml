    title: Document Picker -> Trusted-File Confusion
    difficulty: medium
    masvs:
    - MASVS-PLATFORM-1
    - MASVS-CODE-4
    maswe:
    - MASWE-0050
    owasp_mobile: M4
    cwe:
    - CWE-20
    - CWE-829
    - CWE-73
    display_tags:
    - CWE-20
    - CWE-829
    - MASVS-PLATFORM-1
    tools:
    - frida
    - objection
    - r2frida
    - ipsw
    - class-dump
    - Hopper
    - r2ghidra
    - Ghidra
    summary: The app assumes a file returned by the system document / file picker (or a security-scoped URL) is trustworthy simply because the OS handed it over, and feeds its path / type / contents into a sensitive sink with no re-validation, so an attacker-controlled document provider supplies a malicious path/type that the app trusts - the opposite direction to an over-broad FileProvider (Apple Document Picker / security-scoped URL trust-confusion class).
    manual_test: >-
      return a document from the system picker whose declared type/path is
      hostile (mislabeled type, a path into a privileged location) and confirm
      the app trusts it into a sensitive sink; verify the secure build
      re-validates real content/type and confines the path (Document Picker /
      security-scoped-URL trust class).
    detail: >-
      The app assumes a file returned by the system document or file picker (or a
      security-scoped URL) is trustworthy just because the OS handed it over. It
      feeds the declared type, name, or path into a sensitive sink with no
      re-validation, so a document that claims to be a harmless "text/plain" file
      but whose real bytes are an executable script is parsed or executed, and
      its declared path is followed into a privileged location. The picked bytes
      are written to a real temp file and the magic bytes are re-read off disk;
      the secure path re-validates that real content type and confines the
      canonical path under the import sandbox.
    references:
    - 'Apple: App extensions (File Provider / Document Picker trust boundaries)|https://developer.apple.com/documentation/uikit/app-extensions'
