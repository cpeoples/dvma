      superficially-valid Intent and confirm the action runs with the app's
      privileges (Android Settings CVE-2025-32326 / CVE-2025-32321 class).
    detail: >-
      A privileged, exported component performs a protected action (for example
      writing a secure setting) on behalf of a caller after only a superficial
      check: it validates the requested action string but never verifies the
      caller's identity or permission. A local, unprivileged app crafts the
      Intent and the deputy carries out the privileged operation for it (Android
      Settings CVE-2025-32326 / CVE-2025-32321 confused-deputy class). This is an
      offline, deterministic simulation: the deputy returns whether it performed
      the action and for whom. The secure path verifies the caller actually holds
      the required permission before acting.
