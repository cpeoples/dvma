    manual_test: >-
      trigger the Android 14+ predictive-back / recents snapshot on a
      sensitive screen and confirm it is captured.
    detail: >-
      This sensitive screen is not marked secure, so Android 14+ captures its
      content into the recents (task-switcher) and predictive-back snapshot,
      retaining the secret where others can see it. Setting FLAG_SECURE or
      setRecentsScreenshotEnabled(false) would store an obscured placeholder
      instead. This button simulates the OS snapshot.
