    manual_test: >-
      review the manifest/Info.plist and confirm full media-library access is
      requested instead of the scoped photo picker.
    detail: >-
      To let the user attach one photo, the app requests full media-library
      permission and receives every photo on the device (including sensitive
      scans), plus standing access to future photos. The modern scoped photo
      picker returns only the item the user selected and grants no standing
      permission, collecting exactly what is needed.
  - id: fileprovider_path_traversal
    platforms:
    - android
    title: FileProvider Path Traversal / Arbitrary File Sharing
    difficulty: hard
    masvs:
    - MASVS-PLATFORM-1
    - MASVS-STORAGE-1
    mastg_v2:
    - MASTG-TEST-0357
    mastg_demo:
    - MASTG-DEMO-0122
    - MASTG-DEMO-0123
    maswe:
    - MASWE-0032
    owasp_mobile: M4
    cwe:
    - CWE-22
    - CWE-926
    display_tags:
    - CWE-22
    - CWE-926
    - MASVS-PLATFORM-1
    tools:
    - adb
    - drozer
    - jadx
    attack_inputs:
    - malicious companion app
    summary: An over-broad FileProvider / grantUriPermissions lets another app read arbitrary app-private files via a traversal path.
    manual_test: >-
      via drozer / a companion app, request a traversal path (`../`) through
      the FileProvider and read an app-private file.
    detail: >-
      A content resolver joins an attacker-supplied relative path onto the
      app-private shared directory without confining the canonical result, then
      performs a real filesystem read at that path. A "../" path therefore
      escapes the export directory and reads arbitrary app-private files off disk
      (session tokens, other users' data). The real exploit is at the Android
      FileProvider level, an over-broad root-path or grantUriPermissions
      resolving a content:// URI containing "..".
