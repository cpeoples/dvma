# DVMA registry category: platform (shard 01_core)
# WebView, deep links, intents, providers, and IPC basics.
# Shards merge in sorted filename order; append within the right shard,
# then run: dart run tool/generate.dart

platform:
  title: Improper Platform Usage
  owasp_mobile: M4
  description: WebView JS-bridge RCE and file:// access, deep-link/URL-scheme hijack, exported components, content-provider SQLi, pending-intent hijack, tapjacking, over-privilege, push leakage, QR injection, zip-slip, and missing FLAG_SECURE.
  vulnerabilities:
  - id: insecure_webview
    platform_note: Android WebView (addJavascriptInterface); iOS WKWebView (WKScriptMessageHandler).
    title: Insecure WebView (JS Bridge RCE, file:// access)
    difficulty: hard
    masvs:
    - MASVS-PLATFORM-2
    mastg_v2:
    - MASTG-TEST-0334
    - MASTG-TEST-0333
    - MASTG-TEST-0250
    mastg_demo:
    - MASTG-DEMO-0097
    - MASTG-DEMO-0096
    maswe:
    - MASWE-0033
    - MASWE-0034
    owasp_mobile: M4
    cwe:
    - CWE-749
    - CWE-79
    tools:
    - mitmproxy
    - r2frida
    - frida
    - objection
    tools_android:
    - jadx
    - apktool
    tools_ios:
    - ipsw
    - class-dump
    - Hopper
    - r2ghidra
    summary: WebView exposes a JS bridge and enables file:// access for RCE-style abuse.
    manual_test: >-
      reach the JS bridge / `file://` and demonstrate RCE-style behavior.
    detail: >-
      The WebView enables JavaScript, file:// access, and a native JS bridge (an
      addJavaScriptChannel named "Native") with no origin allowlist, so a
      malicious or MITM'd page can call into app internals to read files and
      invoke native methods, an RCE-style abuse. This runs a real Android System
      WebView: the loaded page posts to the exposed Native channel and the native
      handler returns the app secret or an on-device file back to page JS.
  - id: deeplink_url_scheme_hijack
    platform_note: Android implicit deep links / App Links; iOS custom URL schemes / Universal Links.
    title: Deep Link / URL Scheme Hijack
    difficulty: medium
    masvs:
    - MASVS-PLATFORM-1
    mastg_v2:
    - MASTG-TEST-0028
    - MASTG-TEST-0393
    - MASTG-TEST-0371
    mastg_demo:
    - MASTG-DEMO-0151
    maswe:
    - MASWE-0029
    owasp_mobile: M4
    cwe:
    - CWE-939
    - CWE-20
    tools: []
    tools_android:
    - adb
    - drozer
    - jadx
    tools_ios:
    - xcrun simctl openurl
    - idb
    summary: Custom scheme is unvalidated and can be claimed/abused by another app.
    manual_test: >-
      fire crafted deep links with `adb`.
    detail: >-
      The custom URL scheme is unverified, so any installed app can also register
      it, and its parameters are trusted as-is, so a crafted link can drive a
      password reset or an open redirect. Verified App Links or Universal Links
      should be used instead of a bare custom scheme.
    references:
    - 'CVE-2026-23866 (WhatsApp iOS/Android: message payload dispatches an OS custom-scheme handler without validation, CWE-940)|https://nvd.nist.gov/vuln/detail/CVE-2026-23866'
    - 'Android: verify App Links (autoVerify)|https://developer.android.com/training/app-links/verify-android-applinks'
    - 'Apple: supporting Universal Links|https://developer.apple.com/documentation/xcode/supporting-universal-links-in-your-app'
  - id: exported_android_components
    platforms:
    - android
    title: Exported Android Components
    difficulty: medium
    masvs:
    - MASVS-PLATFORM-1
    mastg_v2:
    - MASTG-TEST-0364
    - MASTG-TEST-0365
    - MASTG-TEST-0366
    mastg_demo:
    - MASTG-DEMO-0128
    - MASTG-DEMO-0129
    - MASTG-DEMO-0130
    maswe:
    - MASWE-0032
    - MASWE-0018
    owasp_mobile: M4
    cwe:
    - CWE-926
    - CWE-284
    tools:
    - adb
    - drozer
    - apktool
    - jadx
    summary: Activities/services/receivers exported with no permission checks.
    manual_test: >-
      enumerate/invoke with drozer.
    detail: >-
      Activities, receivers, and services are exported with no permission guard,
      so any installed app (or adb/drozer) can start them directly and reach
      privileged flows. This is a manifest-level flaw. On Android, DVMA declares
      an exported AdminActivity, and this screen starts it in-process by component
      name (the same startActivity path adb, drozer, or a separate app would hit)
      and reads back the caller it recorded, reaching an internal-only screen with
      no permission guard.
  - id: content_provider_sql_injection
    platforms:
    - android
    title: Content Provider SQL Injection
    difficulty: hard
    masvs:
    - MASVS-PLATFORM-1
    - MASVS-CODE-4
    mastg_v2:
    - MASTG-TEST-0339
    - MASTG-TEST-0355
    mastg_demo:
    - MASTG-DEMO-0102
    - MASTG-DEMO-0121
    maswe:
    - MASWE-0018
    - MASWE-0050
    owasp_mobile: M4
    cwe:
    - CWE-89
    display_tags:
    - CWE-89
    - MASVS-PLATFORM-1
    tools:
    - adb
    - drozer
    - jadx
    - sqlite3
    summary: Exported content provider builds SQL by string concatenation.
    manual_test: >-
      inject via the provider with drozer.
    detail: >-
      An exported content provider concatenates the caller-supplied selection
      straight into SQL instead of using parameterized args. A malicious app
      (drozer, or adb shell content query) supplies a UNION or tautology
      selection and exfiltrates the secret column. On a device the real exported
      provider (content://com.dvma.provider.vuln/users) runs the concatenated
      query over a seeded SQLite database and returns the leaked rows; offline an
      in-memory engine mirrors it so the demo stays testable.
  - id: pending_intent_hijacking
    platforms:
    - android
    title: Pending Intent Hijacking
    difficulty: hard
    masvs:
    - MASVS-PLATFORM-1
    mastg_v2:
    - MASTG-TEST-0381
    - MASTG-TEST-0030
    mastg_demo:
    - MASTG-DEMO-0147
    maswe:
    - MASWE-0032
    owasp_mobile: M4
    cwe:
    - CWE-927
    tools:
    - adb
    - drozer
    - jadx
    - dumpsys
    attack_inputs:
    - malicious companion app
    summary: Mutable, implicit PendingIntent can be intercepted/redirected.
    manual_test: >-
      intercept the mutable PendingIntent.
    detail: >-
      The PendingIntent is created MUTABLE and wraps an IMPLICIT base intent, so
      a malicious app that receives it can fill in the blank component and extras
      and fire it with this app's identity and permissions. On a real device the
      module posts a genuine mutable, implicit PendingIntent inside a
      notification, observable via dumpsys, rather than only describing the flaw.
      The fix is FLAG_IMMUTABLE plus an explicit intent that names its target
      component, leaving nothing for a recipient to redirect.
