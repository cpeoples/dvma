    - MASVS-PLATFORM-2
    tools:
    - objection
    - frida
    - r2frida
    - ipsw
    - class-dump
    - Hopper
    - r2ghidra
    - Ghidra
    summary: Unsanitized user-controlled fields are reflected into a WebView, and file access is left enabled, so injected JS can read the app's local files from the WebView context (ZOLL ePCR iOS CVE-2025-12699 class).
    manual_test: >-
      inject HTML/JS into a reflected field and confirm the WebView (with file
      access enabled) can read the app's local files; verify the secure build
      escapes output and disables file access (ZOLL ePCR iOS CVE-2025-12699
      class).
    detail: >-
      An unsanitized user-controlled field is reflected into HTML rendered in a
      WKWebView that was created with local file access enabled and a file://
      origin. Injected JavaScript therefore runs and can fetch() the app's own
      local files (session tokens, patient records) and exfiltrate them (ZOLL
      ePCR iOS CVE-2025-12699 class). On a real device this runs a genuine
      WebView that actually reads the seeded local file: on iOS a real WKWebView
      backed by a custom WKURLSchemeHandler that serves the page and the secret
      under one origin, and on Android a System WebView with file access enabled
      reading over a file:// origin; off-device it falls back to a deterministic
      model. The secure path HTML-escapes the reflected field and disables local
      file access, so the payload is inert and no files are reachable.
    references:
    - CVE-2025-12699 (ZOLL ePCR iOS)|https://nvd.nist.gov/vuln/detail/CVE-2025-12699
