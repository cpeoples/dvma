  - id: zip_path_traversal
    title: Zip Path Traversal (Zip-Slip)
    difficulty: hard
    masvs:
    - MASVS-CODE-4
    - MASVS-STORAGE-1
    maswe:
    - MASWE-0050
    owasp_mobile: M4
    cwe:
    - CWE-22
    display_tags:
    - CWE-22
    - MASVS-CODE-4
    tools: []
    attack_inputs:
    - crafted zip
    summary: Update-package unpacker writes entries outside the target dir.
    manual_test: >-
      feed a zip-slip archive to the update unpacker.
    detail: >-
      The update unpacker joins each zip entry name to the target directory
      without verifying the result stays inside it, then writes the entry to
      disk. A crafted entry name escapes into system paths and overwrites
      arbitrary files. A real archive is built and each entry is extracted to a
      real filesystem (recoverable from the device, adb-pullable, or via
      backup/jailbreak on iOS); the traversing entry lands outside the extract
      directory.
