  - id: over_privileged_permissions
    title: Over-Privileged Permissions
    difficulty: easy
    masvs:
    - MASVS-PLATFORM-1
    - MASVS-PRIVACY-2
    mastg_v2:
    - MASTG-TEST-0254
    - MASTG-TEST-0255
    mastg_demo:
    - MASTG-DEMO-0033
    maswe:
