      attacker-chosen target, handing a malicious app read/write access to files
      it should never reach (Pixel CVE-2024-27222 Intent-redirect and grant-URI
      class). This is an offline, deterministic simulation: the broker returns
      which package ended up holding the grant. The secure path strips inbound
      grant flags on redirect and only forwards to a trusted target allowlist.
