    - CWE-926
    - CWE-749
    - MASVS-PLATFORM-1
    tools:
    - adb
    - drozer
    - jadx
    summary: An exported component takes an attacker-supplied URL/activity target and opens it with the app's identity/privileges (ABEMA CVE-2024-28745 / Samsung Members CVE-2026-20985 & CVE-2025-21079 class).
    manual_test: >-
      via drozer/adb, deliver an external intent naming an attacker URL /
      internal activity and confirm it opens with the app's identity (ABEMA
      CVE-2024-28745 / Samsung Members CVE-2026-20985 & CVE-2025-21079 class).
    detail: >-
      An exported component reads attacker-supplied extras naming a URL and/or an
      activity and opens whatever is named, with this app's identity and
      privileges. With no allowlist, another app can point it at an arbitrary URL
      or, worse, a privileged internal activity (admin, debug, session-export)
      that should only be reachable in-process (the ABEMA CVE-2024-28745 /
      Samsung Members CVE-2026-20985 & CVE-2025-21079 class). This is an offline,
      deterministic simulation: the intent is a map of extras and "opening"
      returns a descriptor of what would launch. The secure handler allowlists
      only public activities and first-party https URLs.
  - id: implicit_intent_sensitive_data
    platforms:
    - android
    title: Implicit Intent Leaks Sensitive Data
    difficulty: medium
    masvs:
    - MASVS-PLATFORM-1
    - MASVS-STORAGE-2
    mastg_v2:
    - MASTG-TEST-0374
    - MASTG-TEST-0372
    mastg_demo:
    - MASTG-DEMO-0138
    maswe:
    - MASWE-0032
    owasp_mobile: M4
    cwe:
    - CWE-927
    - CWE-200
    display_tags:
    - CWE-927
    - CWE-200
    - MASVS-PLATFORM-1
    tools:
    - adb
    - drozer
    - jadx
    summary: Sensitive data is placed on an implicit intent (no explicit component/package), so any co-resident app registering a matching filter receives it (Samsung Smart View CVE-2025-21024 class).
    manual_test: >-
      register a receiver in a second app for the same action and confirm
      sensitive extras sent on an implicit intent are delivered to it (Samsung
      Smart View CVE-2025-21024 class); confirm an explicit (packaged) send
      does not leak.
    detail: >-
      Sensitive extras (an auth token and the account email) are placed on an
      implicit intent, one that names only an action and sets no explicit
      component or package, and broadcast. Android resolves an implicit intent by
      its action and delivers it to every app that registered a matching
      intent-filter, so a co-resident malicious app that claimed the same action
      silently receives the payload (the Samsung Smart View CVE-2025-21024
      class). On Android, DVMA emits the implicit broadcast and the companion
      attacker (which claimed the same action) receives the extras. The secure
      path sends an explicit intent addressed to the single trusted package, so
      the eavesdropper gets nothing.
  - id: pendingintent_provenance_confusion
    platforms:
    - android
    title: PendingIntent Provenance Confusion
    difficulty: hard
    masvs:
    - MASVS-PLATFORM-1
    - MASVS-AUTH-1
    mastg_v2:
    - MASTG-TEST-0381
    mastg_demo:
    - MASTG-DEMO-0147
    maswe:
    - MASWE-0032
    - MASWE-0018
    owasp_mobile: M4
    cwe:
    - CWE-441
    - CWE-290
    - CWE-923
    display_tags:
    - CWE-441
    - CWE-290
    - MASVS-PLATFORM-1
    tools:
    - adb
    - drozer
    - jadx
    attack_inputs:
    - malicious companion app
    summary: An SDK/receiver assumes 'who presents a PendingIntent' == 'who created it', so a replayed/forwarded PendingIntent authenticates an attacker as the creating app (PendingIntent provenance-confusion research, arXiv 2603.02539).
    manual_test: >-
      obtain/replay a PendingIntent the app created and confirm the receiving
      SDK authenticates the presenter as the creator app (arXiv 2603.02539);
      confirm strict presenter==creator checking rejects it.
    detail: >-
      A PendingIntent is a capability that can be forwarded, stored, and
      replayed. This SDK authenticates a caller by trusting what the token
      claims (its creatorPackage) instead of verifying who actually presents it.
      So a token minted by a trusted app, once forwarded to or stolen by a
      malicious app, lets the attacker present it and be authenticated as the
      trusted app, a confused-deputy or provenance-confusion flaw (arXiv
      2603.02539). This is an offline, deterministic simulation: the token is a
      plain value and authentication returns the attributed identity. The strict
      authenticator binds the capability to its creator and requires a
      non-replayable, immutable, single-use token, rejecting the mismatch.
  - id: inapp_browser_ui_spoofing
    title: In-App Browser UI / Address-Bar Spoofing
    difficulty: medium
    masvs:
    - MASVS-PLATFORM-2
    maswe:
    - MASWE-0035
    owasp_mobile: M4
    cwe:
    - CWE-1021
    - CWE-451
    tools:
    - frida
    - objection
    summary: An in-app WebView browser derives the displayed origin/address-bar from attacker-controllable content instead of the real committed URL, enabling website spoofing / UI misrepresentation (Firefox Focus CVE-2025-10290 / LINE CVE-2024-5739 trust class).
    manual_test: >-
      load attacker content that sets a fake title/origin and confirm the
      in-app browser address bar shows a trusted origin while the real
      committed URL is the attacker's (Firefox Focus CVE-2025-10290 / LINE
      CVE-2024-5739 class).
    detail: >-
      The in-app WebView browser builds the origin shown in its address bar from
      attacker-controllable page content (document.title, a pushState path, or a
      data: or about: trick) instead of the real committed URL. So the chrome
      shows a trusted https origin while the page actually loaded is the
      attacker's site, and the user trusts a lie and enters credentials (the
      Firefox Focus CVE-2025-10290 / LINE CVE-2024-5739 trust class). On Android
      this drives a real in-app WebView: the loaded page sets document.title, and
      the address bar is driven from that page-controlled title rather than the
      true committed origin. The secure version always derives the address bar
      from the true committed origin, ignoring page claims.
    references:
    - CVE-2025-10290 (Firefox Focus iOS URL-scheme UI spoofing)|https://nvd.nist.gov/vuln/detail/CVE-2025-10290
    - CVE-2025-31254 (iOS unexpected URL redirection / insufficient URL validation)|https://support.apple.com/en-ca/125108
    - CVE-2026-14137 (Chrome for iOS UI spoofing via crafted HTML)|https://nvd.nist.gov/vuln/detail/CVE-2026-14137
    tools_android:
    - adb
    tools_ios:
    - xcrun simctl openurl
  - id: cross_app_scripting
    platforms:
    - android
    title: Cross-App Scripting (Untrusted Intent -> Exported Activity -> WebView JS)
    difficulty: hard
    masvs:
    - MASVS-PLATFORM-2
    - MASVS-CODE-4
    mastg_v2:
    - MASTG-TEST-0332
    - MASTG-TEST-0031
    mastg_demo:
    - MASTG-DEMO-0095
    maswe:
    - MASWE-0035
    - MASWE-0032
    owasp_mobile: M4
    cwe:
    - CWE-79
    - CWE-749
    - CWE-940
    display_tags:
    - CWE-79
    - CWE-749
    - CWE-940
    - MASVS-PLATFORM-2
    tools:
    - adb
    - drozer
    - jadx
    summary: An exported activity takes an attacker-controlled Intent value and passes it to WebView loadUrl()/evaluateJavascript() without validation, giving JS execution in the trusted origin (Google's named Cross-App Scripting class; Element CVE-2024-26131/26132, FireDown CVE-2024-31974, TikTok CVE-2024-45240).
    manual_test: >-
      from a co-resident app, fire an Intent whose value is a `javascript:`
      payload (or an attacker URL) at the exported activity and confirm it
      executes in the WebView's trusted origin; verify the secure build
      validates scheme+origin first (Google Cross-App Scripting class; Element
      CVE-2024-26131/26132, TikTok CVE-2024-45240).
    detail: >-
      An exported activity reads an attacker-controlled Intent extra (a URL
      string) and hands it straight to a WebView via loadUrl() or
      evaluateJavascript() with no validation. The WebView is already
      authenticated to the trusted first-party origin, so a "javascript:" payload
      from a co-resident malicious app executes in that trusted origin and can
      read the victim's cookies and session (Google's Cross-App Scripting class;
      Element CVE-2024-26131/26132, FireDown CVE-2024-31974, TikTok
      CVE-2024-45240). On Android a "javascript:" payload is actually run inside a
      real in-app WebView committed to the trusted origin, so it executes in that
      origin and can read the victim's session. The offline model records what
      executed and in which origin. The secure path rejects the "javascript:"
      scheme and only navigates to https URLs on the trusted-origin allowlist.
    references:
    - 'Google: Fixing a Cross-App Scripting Vulnerability|https://support.google.com/faqs/answer/9084685?hl=en'
    - CVE-2024-26131 / CVE-2024-26132 (Element Android)|https://www.shielder.com/blog/2024/04/element-android-cve-2024-26131-cve-2024-26132-never-take-intents-from-strangers/
    - CVE-2024-31974 (Solarized FireDown)|https://github.com/actuator/com.solarized.firedown/blob/main/CVE-2024-31974
    - CVE-2024-45240 (TikTok LynxView)|https://nvd.nist.gov/vuln/detail/CVE-2024-45240
