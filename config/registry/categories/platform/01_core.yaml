  - id: intent_arg_injection_rce
    platforms:
    - android
    title: Intent Argument Injection -> Local Code Execution
    difficulty: hard
    masvs:
    - MASVS-PLATFORM-1
    - MASVS-CODE-4
    maswe:
    - MASWE-0032
    owasp_mobile: M4
    cwe:
    - CWE-88
    - CWE-829
    - CWE-94
    display_tags:
    - CWE-88
    - CWE-829
    - MASVS-PLATFORM-1
    tools:
    - adb
    - drozer
    - jadx
    - apktool
    summary: An exported component feeds an attacker-controlled intent extra / command-line arg into an execution path, so another app runs code with this app's privileges (Unity CVE-2025-59489 class).
    manual_test: >-
      with drozer/adb, invoke the exported component with a crafted extra
      (e.g. `-xrun`/`cmd`/`loadLibrary`) and confirm attacker-controlled args
      reach an execution path with the app's privileges (Unity CVE-2025-59489
      class); confirm the allowlist handler rejects it.
    detail: >-
      An exported "launcher" component reads attacker-controlled intent extras
      (a command, a library path, a runtime flag) and feeds them straight into an
      execution path. A malicious app can therefore send an intent that selects a
      privileged op, dumping app secrets or "loading" an attacker-supplied
      library path, which runs with this app's privileges (the Unity
      CVE-2025-59489 class). This is an offline, deterministic simulation: the
      intent is a map of extras and the executor maps op strings to effects. A
      secure handler allowlists only safe navigation actions and ignores any
      injected execution arg.
  - id: deeplink_to_webview_navigation
    title: Deep Link -> Trusted WebView Navigation
    difficulty: medium
    masvs:
    - MASVS-PLATFORM-2
    - MASVS-PLATFORM-1
    mastg_v2:
    - MASTG-TEST-0332
    - MASTG-TEST-0027
    mastg_demo:
    - MASTG-DEMO-0095
    maswe:
    - MASWE-0035
    - MASWE-0029
    owasp_mobile: M4
    cwe:
    - CWE-939
    - CWE-601
    - CWE-749
    display_tags:
    - CWE-939
    - CWE-601
    - MASVS-PLATFORM-2
    tools: []
    tools_android:
    - adb
    - drozer
    - jadx
    tools_ios:
    - xcrun simctl openurl
    - idb
    summary: A URL parameter from an incoming deep link/intent is loaded straight into a trusted WebView with no origin allowlist, so an attacker renders arbitrary content in-app (TikTok CVE-2024-45240 / Rakuten CVE-2024-41918 / EcoOnline CVE-2026-26897 class).
    manual_test: >-
      send a deep link whose `url` param points off-origin (or
      `javascript:`/`file://`) and confirm it loads in the trusted WebView
      with no origin allowlist (TikTok CVE-2024-45240 / Rakuten CVE-2024-41918
      / EcoOnline CVE-2026-26897 class).
    detail: >-
      An incoming deep link carries a url parameter that the app loads directly
      into a trusted in-app WebView. Because there is no origin allowlist, any
      origin, and even javascript: or file:// URLs, is rendered inside the app's
      security context (shared session and cookies, JS bridges), enabling
      phishing and local-file or JS execution (the CVE-2026-26897 class). On
      Android the resolved URL is navigated into a real trusted in-app WebView,
      rendering it inside the app security context. The secure router allows only
      first-party https origins and rejects everything else.
    references:
    - CVE-2026-22072 (OPPO arbitrary URL -> WebView token theft)|https://github.com/advisories/GHSA-96vw-w9m3-gj89
