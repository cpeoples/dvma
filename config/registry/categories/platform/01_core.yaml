    tools:
    - MobSF
    tools_android:
    - aapt
    - jadx
    - apktool
    tools_ios:
    - ipsw
    - codesign
    - plutil
    summary: Requests broad permissions unrelated to app functionality.
    manual_test: >-
      review the manifest with aapt/jadx.
    detail: >-
      The app declares dangerous Android permissions (contacts, precise
      location, SMS, call log, phone state, microphone, external storage,
      accounts) that none of its features use. They are declared in
      AndroidManifest.xml and are recoverable from the built APK with aapt or
      jadx, so the over-privilege widens the attack surface and privacy
      exposure. CAMERA is excluded because it is declared not-required and
      genuinely used by the QR-scanning demos, so it is justified rather than
      over-privilege. iOS declares no unused usage-description keys (its camera,
      tracking, and Face ID keys each back a demo), so this finding is
      Android-specific.
