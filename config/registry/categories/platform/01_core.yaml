  - id: qr_code_injection
    title: QR Code Injection
    difficulty: medium
    masvs:
    - MASVS-CODE-4
    maswe:
    - MASWE-0050
    owasp_mobile: M4
    cwe:
    - CWE-20
    tools:
    - adb
    - frida
    attack_inputs:
    - crafted QR
    summary: Scanner trusts scanned content and acts on it without validation.
    manual_test: >-
      scan a crafted QR and confirm unvalidated action.
    detail: >-
      The QR scanner trusts whatever it decodes and immediately acts on it,
      following dvma:// app commands, javascript: and file: URIs, and links, with
      no validation or confirmation. A malicious QR can therefore trigger
      privileged actions. The decoded value entered on this screen stands in for
      the camera scan.
