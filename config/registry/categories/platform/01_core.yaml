    summary: An attacker-controlled URL parameter passed into a fetch/media loader is not restricted to an allowlist, so the app can be steered to internal/loopback endpoints (WhatsApp iOS CVE-2026-23866 SSRF-via-URL-scheme class).
    manual_test: >-
