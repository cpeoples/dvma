    summary: A forwarded/redirected Intent carries FLAG_GRANT_READ/WRITE_URI_PERMISSION to a private content:// URI, so a malicious app is transitively granted access to files it should not reach (Pixel CVE-2024-27222 Intent-redirect + grant-URI class).
    manual_test: >-
      send a redirected Intent carrying `FLAG_GRANT_READ_URI_PERMISSION` to a
      private `content://` URI and confirm the malicious app reads a file it
      was never granted directly (Pixel CVE-2024-27222 class).
    detail: >-
      The app receives an Intent from an untrusted caller and forwards it onward
      without stripping the grant flags. The forwarded Intent still carries
      FLAG_GRANT_READ/WRITE_URI_PERMISSION pointing at a private content://
