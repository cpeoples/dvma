    - r2frida
    - frida
    - objection
    - sqlite3
    tools_android:
    - jadx
    - adb
    tools_ios:
    - ipsw
    - ifuse
    summary: A super-app hosts multiple mini-programs in ONE shared WebView instance (shared cookie jar / localStorage), so one mini-app reads another mini-app's cookies and storage - a cross-tenant isolation failure enabling data exfiltration between mini-apps (WeChat/Alipay/TikTok/Baidu cross-mini-program cookie-sharing research).
    manual_test: >-
      from mini-app A, read mini-app B's cookie/localStorage out of the shared
      WebView jar; verify the secure build partitions storage per mini-app
      origin so A cannot see B (WeChat/Alipay cross-mini-program
      cookie-sharing research class).
    detail: >-
      A super-app hosts multiple mini-programs in one shared WebView instance with a
      single shared cookie jar / localStorage keyed loosely, so mini-app A reads
      mini-app B's cookies and storage, a cross-tenant isolation failure enabling
      data exfiltration between mini-apps (WeChat / Alipay / TikTok / Baidu
      cross-mini-program cookie-sharing research). This loads two mini-apps in one
      real shared WebView so mini-app A reads B's cookie/storage from the shared jar
      (the in-memory panel is the offline contrast). The secure path partitions
      storage per mini-app origin, so A cannot see B's cookie while B still reads its
      own.
    references:
    - Demystifying Cookie Sharing Risks in WebView-based app-in-app ecosystems|https://arxiv.org/abs/2510.24141
  - id: provider_metadata_to_filesystem_traversal
    platforms:
    - android
    title: Provider-Controlled Metadata -> Plugin Filesystem Traversal
    difficulty: hard
    masvs:
    - MASVS-PLATFORM-1
    - MASVS-STORAGE-2
    mastg_demo:
    - MASTG-DEMO-0139
    maswe:
    - MASWE-0032
    owasp_mobile: M4
    cwe:
    - CWE-22
    - CWE-73
    - CWE-20
    display_tags:
    - CWE-22
    - CWE-73
    - MASVS-PLATFORM-1
    tools: []
    tools_android:
    - drozer
    - jadx
    - adb
    tools_ios:
    - ipsw
    - class-dump
    attack_inputs:
    - malicious companion app
    summary: A framework/plugin layer (Flutter/React Native/Cordova/Capacitor) reads DISPLAY_NAME from an UNTRUSTED ContentProvider via ContentResolver.query() and uses it in filesystem path construction with no sanitization, so a malicious provider returns a `../` filename and the plugin writes/reads outside its intended cache - a plugin-boundary traversal where the dangerous code lives behind an innocent-looking app API (Flutter file_picker CVE-2026-38093 class).
    manual_test: >-
      from a malicious ContentProvider return a DISPLAY_NAME of
      `../../shared_prefs/x` and confirm the file-picker plugin writes/reads
      outside its cache root while the app only called an innocent `pick()`;
      verify the secure build takes the basename / canonicalizes and confines
      under the cache root (Flutter file_picker CVE-2026-38093 plugin-boundary
      class).
    detail: >-
      A framework/plugin layer reads DISPLAY_NAME from an untrusted ContentProvider
      and uses it directly in filesystem path construction with no sanitization. The
      app author calls an innocent-looking pick() API, but inside the plugin a
      malicious provider's "../" display name traverses out of the plugin cache and
      clobbers the app's shared_prefs secrets on disk (Flutter file_picker
      CVE-2026-38093 class). On device this performs a real File(cacheRoot,
      displayName) write. The secure path takes the basename or canonicalizes the
      path and confines the write under the plugin cache root.
    references:
    - CVE-2026-38093 / GHSA-r2rg-pm28-j8gw (Flutter file_picker DISPLAY_NAME path traversal)|https://github.com/advisories/GHSA-r2rg-pm28-j8gw
