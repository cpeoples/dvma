    summary: A WebView opts out of cleartext blocking (android:usesCleartextTraffic / relaxed network-security-config) and relaxes the Mixed Content Policy (setMixedContentMode(MIXED_CONTENT_ALWAYS_ALLOW)), then loads HTTP or mixed content, so a network attacker injects script / downgrades HTTPS->HTTP and escalates to phishing or full app takeover - a WebView-transport failure distinct from app-level cleartext and from WebView XSS (USENIX Security 2026 large-scale HTTP-in-WebView study).
    manual_test: >-
      with cleartext allowed and mixed-content set to ALWAYS_ALLOW, load an
      `http://` (or mixed) page under mitmproxy, inject a script, and confirm
      it runs / a subresource downgrades HTTPS→HTTP; verify the secure build
      blocks cleartext and sets mixed-content to BLOCK so the load is refused
      (USENIX Security 2026 HTTP-in-WebView study).
    detail: >-
      The WebView opts out of cleartext blocking (usesCleartextTraffic / relaxed
      network-security-config) and relaxes mixed content
      (setMixedContentMode(MIXED_CONTENT_ALWAYS_ALLOW)), then loads an http:// page
      (or an http:// subresource on an https page). A network attacker on the path
      downgrades HTTPS->HTTP and injects a script that runs in the WebView and
      exfiltrates the session token (USENIX Security 2026 HTTP-in-WebView study
      class). This loads a real http:// page in a real WebView with mixed content
      allowed (the in-memory panel is the offline contrast). The secure path blocks
      cleartext and sets mixed-content to BLOCK so the http load / mixed subresource
      is refused.
    references:
    - 'Plain Text, Plain Risks: Measuring HTTP Inclusion in Android WebViews at Scale (USENIX Security 2026)|https://www.usenix.org/conference/usenixsecurity26/presentation/beer'
