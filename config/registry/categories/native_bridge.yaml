    summary: '`WebView.setWebContentsDebuggingEnabled(true)` is left on in a production build, so anyone with adb / chrome://inspect access can attach DevTools to the WebView, inspect the DOM/JS, and execute script in the app''s web context - reading tokens, cookies, and authentication material. A production-configuration failure the release build should disable (Android WebView MASTG-TEST-0227 class).'
    manual_test: >-
      with `setWebContentsDebuggingEnabled(true)` in a release build, attach
      chrome://inspect and read the web-context session token; verify the
      secure build disables debugging in release builds (MASTG-TEST-0227).
    detail: >-
      The app leaves WebView.setWebContentsDebuggingEnabled(true) on in a release
      build. That exposes the WebView over the Chrome DevTools Protocol, so anyone
      with adb / chrome://inspect access attaches DevTools to the app web context,
      inspects the live DOM/JS, and evaluates script, reading the session
      cookie/token and auth material in the page (Android WebView MASTG-TEST-0227
      class). This boots a real WebView with debugging enabled and reads the live JS
      context back; the in-memory panel is the offline contrast. The secure path
      forces debugging off in release builds so the inspector fails closed, while
      still allowing DevTools in debug builds for local development.
