    detail: >-
      The WebView turns off Google Safe Browsing (setSafeBrowsingEnabled(false) /
      manifest EnableSafeBrowsing=false), stripping the browser-originated
      malware/phishing protection that normally shows a full-page interstitial before
      a known-bad navigation. With it disabled, the app silently loads a known
      phishing/malware URL with no warning. This is not XSS; it is a deliberately
      removed platform protection (Android WebView MASTG-TEST-0399 class). This
      navigates a real WebView to the known-bad URL (the in-memory panel is the
      offline contrast). The secure path keeps Safe Browsing on, blocks known-bad
      hosts with an interstitial, and still allows benign URLs.
