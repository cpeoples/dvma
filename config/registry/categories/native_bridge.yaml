  - id: webview_url_loading_policy_confusion
    platforms:
    - android
    - ios
    platform_note: 'Android shouldOverrideUrlLoading / iOS decidePolicyForNavigationAction: the URL-policy handler implementation is the boundary.'
    title: WebView URL-Loading Policy Confusion
    difficulty: hard
    masvs:
    - MASVS-PLATFORM-2
    - MASVS-CODE-4
    mastg_v2:
    - MASTG-TEST-0332
    - MASTG-TEST-0398
    mastg_demo:
    - MASTG-DEMO-0157
    maswe:
    - MASWE-0035
    owasp_mobile: M4
    cwe:
    - CWE-20
    - CWE-441
    - CWE-939
    display_tags:
    - CWE-20
    - CWE-939
    - MASVS-PLATFORM-2
    tools:
    - mitmproxy
    - frida
    - objection
    tools_ios:
    - ipsw
    - Hopper
    attack_inputs:
    - crafted navigation URL
    summary: The WebView's URL-policy handler (`shouldOverrideUrlLoading` / `decidePolicyForNavigationAction`) makes a trust decision on a raw, un-canonicalized URL, so scheme/host confusion (`javascript:`, `file:`, `content:`, a custom scheme, a redirect, or a malformed URL) slips past the allow/deny logic and loads privileged content. The bug is the policy IMPLEMENTATION, not merely calling loadUrl (Android/iOS URL-loading-handler MASTG-TEST-0332 class).
    manual_test: >-
      feed the URL-policy handler (`shouldOverrideUrlLoading` /
      `decidePolicyForNavigationAction`) crafted URLs (`javascript:`, `file:`,
      look-alike subdomain, host-in-query) and confirm the naive
      `contains`-style check loads them; verify the secure handler
      canonicalizes + allowlists scheme AND exact host (MASTG-TEST-0332).
    detail: >-
      The WebView navigation-policy handler (shouldOverrideUrlLoading /
      decidePolicyForNavigationAction) makes its allow/deny trust decision on a raw,
      un-canonicalized URL. A naive substring check against the intended host lets
      scheme/host confusion slip through: javascript: (script), file:// (local file
      read), content:// (privileged provider), a look-alike subdomain
      (app.example.evil.com), or the genuine host smuggled into a query
      (evil.example/?next=app.example). The bug is the policy implementation, not
      loadUrl (MASTG-TEST-0332 class). This applies the naive policy in a real
      WebView navigation delegate and loads the crafted URL (the in-memory panel is
      the offline contrast). The secure path canonicalizes and parses the URL, then
      allowlists scheme (https only) and the exact host, rejecting the crafted URLs
      while allowing the genuine one.
    references:
    - 'OWASP MASTG-TEST-0332: attacker-controlled URI in WebViews|https://mas.owasp.org/MASTG/tests/ios/MASVS-PLATFORM/MASTG-TEST-0332/'
    tools_android:
    - jadx
