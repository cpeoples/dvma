      the second factor, the Authenticator CVE-2026-26123 class. On Android this
      is an unprotected broadcast the companion com.dvma.attacker app receives;
      the iOS peer is a shared pasteboard, custom URL scheme, or App Group. A
      secure design gates delivery behind a signature-level permission (or a
      private, per-recipient channel) so an arbitrary app gets nothing.
