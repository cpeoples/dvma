    manual_test: >-
      fire a deep link (e.g. `dvma://wallet`) via adb while logged out and
      confirm it reaches the authenticated screen without the app-lock/login
      gate (Groww CVE-2026-12065 class).
    detail: >-
      A deep link routes directly to an authenticated screen (dvma://wallet,
      dvma://transfer), skipping the app-lock / login gate the normal in-app
      navigation enforces. The vulnerable router honors the requested target
      without checking whether the user is authenticated, so an attacker-
      triggered link opens the wallet and returns its balance while the user is
      logged out (the Groww CVE-2026-12065 class). The secure router enforces the
      auth gate and redirects protected routes to login.
  - id: biometric_authorization_not_bound
    platform_note: Android BiometricPrompt CryptoObject; iOS LAContext / Secure Enclave.
    title: Biometric Result Not Bound to Operation
    difficulty: hard
    masvs:
    - MASVS-AUTH-2
    - MASVS-AUTH-1
    mastg_v2:
    - MASTG-TEST-0327
    - MASTG-TEST-0266
    - MASTG-TEST-0267
    mastg_demo:
    - MASTG-DEMO-0090
    maswe:
    - MASWE-0020
    owasp_mobile: M3
    cwe:
    - CWE-287
    - CWE-1021
    - CWE-306
    display_tags:
    - CWE-287
    - CWE-1021
    - MASVS-AUTH-2
    tools:
    - frida
    - objection
    - r2frida
    - frida-trace
    summary: The biometric prompt returns a boolean success that is NOT cryptographically bound to the specific operation being authorized (no CryptoObject / no signed server challenge), and the prompt UI can be overlaid, so a success is replayed or spoofed onto a different sensitive operation - authorization is decoupled from the biometric event (Android BiometricPrompt overlay CVE-2025-48528 class). Distinct from a trivially-bypassed prompt.
    manual_test: >-
      capture a biometric success for operation A and replay it to authorize
      operation B (the boolean isn't tied to the operation), and overlay the
      prompt; verify the secure build binds the result to a per-operation
      signed challenge (CryptoObject) so it only authorizes the exact op
      (Android biometric-overlay CVE-2025-48528 class).
    detail: >-
      The biometric prompt returns a bare boolean success that is not
      cryptographically bound to the operation being authorized (no CryptoObject,
      no signed server challenge). A success the user gave for a low-value
      operation (view balance) is therefore replayed to authorize a different
      sensitive operation (a wire transfer), and an overlaid prompt lets an
      attacker capture or redirect the result (Android BiometricPrompt
      CVE-2025-48528 class). The secure path binds the biometric result to a
      per-operation signed challenge, so the token only authorizes the exact
      operation it was minted for.
    references:
    - CVE-2025-48528 (Android biometric UI overlay)|https://nvd.nist.gov/vuln/detail/CVE-2025-48528
  - id: credential_provider_release_authorization
    platform_note: Android CredentialManager provider; iOS ASCredentialProviderExtension.
    title: Credential Provider Release Authorization Failure
    difficulty: hard
    masvs:
    - MASVS-AUTH-2
    - MASVS-AUTH-1
    maswe:
    - MASWE-0018
    owasp_mobile: M3
    cwe:
    - CWE-863
    - CWE-284
    - CWE-346
    display_tags:
    - CWE-863
    - CWE-346
    - MASVS-AUTH-2
    tools:
    - frida
    - objection
    - r2frida
    tools_android:
    - adb
    - drozer
    - jadx
    tools_ios:
    - ipsw
    - class-dump
    - Hopper
    summary: A credential-provider / password-manager extension releases a stored credential or passkey assertion without validating the calling app / relying-party identity or the user-verification state, so a spoofed calling app or a relying-party mismatch obtains a credential (or enumerates entries) - the credential-release boundary, broader than WebAuthn itself (Apple/Android credential-provider extension authorization class).
    manual_test: >-
      from a spoofed calling app / with an rpId mismatch (and no
      user-verification) extract a stored credential/passkey and enumerate
      entries; verify the secure build binds the calling app to the rpId,
      requires UV, and refuses enumeration (credential- provider
      release-boundary class).
    detail: >-
      A credential-provider / password-manager extension releases a stored
      credential or passkey assertion without validating the calling app
      identity, the relying-party (rpId) binding, or the user-verification state.
      A spoofed calling app therefore extracts the bank credential (rpId or
      calling-app mismatch, no user verification), and the API even lets any
      caller enumerate the stored relying parties. The secure path validates that
      the calling app is bound to the rpId (asset-links / associated-domains
      style), requires user verification, and refuses enumeration.
    references:
    - 'Apple: Passkey use in web browsers (credential provider release boundary)|https://developer.apple.com/documentation/authenticationservices/passkey-use-in-web-browsers'
  - id: multi_account_isolation_failure
    platforms:
    - android
    - ios
    title: Multi-Account Isolation Failure
    difficulty: medium
    masvs:
    - MASVS-AUTH-1
    - MASVS-STORAGE-1
    maswe:
    - MASWE-0024
    owasp_mobile: M3
    cwe:
    - CWE-459
    - CWE-200
    - CWE-613
    display_tags:
    - CWE-459
    - CWE-200
    - MASVS-AUTH-1
    tools:
    - mitmproxy
    - sqlite3
    - frida
    tools_android:
    - adb
    - run-as
    tools_ios:
    - objection
    - plutil
    attack_inputs:
    - account switch sequence
    summary: Switching accounts (or logging out and into account B) does not fully clear account A's cached credentials, tokens, keys, or on-disk/in-memory data, so account B can read or act with account A's data - and old sessions survive logout. The isolation boundary between accounts on one device fails. The secure path scopes all per-account state to the active principal and wipes/rotates it on switch and logout.
    manual_test: >-
      log into account A, switch to / log into account B, and confirm A's
      cached token/data is still readable (and A's session survives logout);
      verify the secure build scopes per-account state to the active principal
      and wipes/rotates it on switch and logout.
    detail: >-
      Account A signs in on the device, then the user switches to account B.
      Because the app caches credentials in process-wide slots and never tears
      them down, switching (or logging out and back in) does not clear account
      A's token, private note, or live session, so account B reads and acts with
      account A's data, and A's old session survives. Each account's token is
      also persisted to the SharedPreferences XML and not purged on switch, so
      account A's token lingers on disk and is pullable with adb. The secure path
      scopes all per-account state to the active principal and wipes or rotates
      it, including the on-disk token, on every switch and logout.
    references:
    - 'OWASP MASVS-AUTH-1 / MASTG: session termination and per-account data isolation|https://mas.owasp.org/MASTG/tests/'
  - id: identity_credential_presentation_binding
    platforms:
    - android
    - ios
    platform_note: Android Identity Credential / Credentials API (mDL/mDoc) and iOS Wallet identity / ISO 18013-5 proximity presentation.
    title: Identity Credential / mDL Presentation Not Bound
    difficulty: hard
    masvs:
    - MASVS-AUTH-2
    - MASVS-AUTH-3
    maswe:
    - MASWE-0020
    owasp_mobile: M3
    cwe:
    - CWE-345
    - CWE-384
    - CWE-290
    display_tags:
    - CWE-345
    - CWE-290
    - MASVS-AUTH-2
    tools:
    - mitmproxy
    tools_ios:
    - ipsw
    - Hopper
    attack_inputs:
    - replayed mDL presentation
    - spoofed holder metadata
    summary: 'A verifier accepts a digital-identity presentation (mDL/mDoc via Identity Credential / ISO 18013-5, or a Wallet identity assertion) without binding it to THIS session: it trusts caller-supplied holder metadata, skips the session-transcript / origin check, does not enforce user-presence, and confuses issuer identity with holder identity - so a replayed or relayed presentation from another session is accepted. Distinct from passkey/WebAuthn: this is the digital-ID / proximity-credential stack. The secure path verifies the issuer signature, binds the device-signed response to the session transcript + reader nonce, and requires fresh user presence.'
    manual_test: >-
      replay a captured mDL/mDoc (Identity Credential / ISO 18013-5) or Wallet
      identity presentation from a different session and confirm the verifier
      accepts it on issuer signature alone; verify the secure build binds the
      device signature to this session's transcript + reader nonce and
      requires fresh user presence.
    detail: >-
      A verifier accepts a digital-identity presentation (mDL/mDoc via Identity
      Credential / ISO 18013-5) without binding it to this session: it checks
      only the issuer signature and trusts holder claims, skipping the
      session-transcript / reader-nonce check and user-presence. So a
      presentation captured from another session is replayed and accepted. This
      is the digital-ID / proximity-credential stack, distinct from
      passkey/WebAuthn. The secure path additionally requires the device
      signature to be over the current session transcript plus reader nonce and
      requires fresh user presence, so the replay is rejected while a genuine
      in-session presentation is accepted.
    references:
    - 'ISO/IEC 18013-5 mDL + Android Identity Credential: session-transcript binding|https://developer.android.com/privacy-and-security/security-identity-credential'
    tools_android:
    - jadx
