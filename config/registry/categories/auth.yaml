    summary: A co-resident malicious app can read OTP codes / auth deep links from this app via an unprotected exported component, broadcast, or shared clipboard (Authenticator CVE-2026-26123 class).
    manual_test: >-
      from a second (unprivileged) app, read the OTP / `myauth://` auth deep
      link this app publishes on an unprotected exported
      component/broadcast/clipboard (Authenticator CVE-2026-26123 class);
      confirm an allowlisted/signature-checked channel yields nothing.
    detail: >-
      A 2FA authenticator publishes the current OTP and an auth deep link
      (myauth://login?otp=...&token=...) to an unprotected cross-app surface.
