    attack_inputs:
    - crafted control-widget invocation
    summary: A Control Widget / interactive widget exposed on the Lock Screen, Control Center, or Action Button invokes a sensitive App Intent without the authentication the full app would require, so a physically-present attacker triggers a privileged operation from a locked device. The question is whether a system surface can invoke a sensitive op without the app's own auth gate (Apple WidgetKit Control lock-screen action-authorization class).
    manual_test: >-
      invoke a sensitive Control Widget / App Intent from the Lock Screen on a
      locked device and confirm it runs with no auth; verify the secure build
      requires unlock/biometric for sensitive intents regardless of surface
      (WidgetKit Controls class).
    detail: >-
      A WidgetKit Control / interactive widget on the Lock Screen, Control Center,
      or Action Button can invoke an App Intent. If a sensitive intent (unlock the
      front door, disable the alarm) runs without the authentication the full app
      would require, a physically-present attacker triggers a privileged operation
      from a locked device. The system surface offering the control is not the
      app's auth gate. On iOS this is backed by a real App Intent
      (UnlockFrontDoorIntent) shipped in the app binary that declares no
      authentication policy, so the system runs it from a locked device; off-iOS it
      uses a deterministic model. The secure path requires unlock or biometric for
      sensitive intents regardless of surface, deferring until authenticated while
      still allowing non-sensitive intents like a flashlight toggle.
    references:
    - 'Apple: WidgetKit Controls (Control Center / Lock Screen / Action Button surfaces)|https://developer.apple.com/documentation/widgetkit/creating-controls-to-perform-actions-across-the-system'
