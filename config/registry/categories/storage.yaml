    summary: The app treats a locally-persisted session/token as authoritative and never checks freshness/revocation server-side, so restoring an OLD local state (from a backup, snapshot, or copied container) revives an already-ended or revoked session and the app believes the user is still authenticated. The secure path validates the session against a server nonce / revocation list / monotonically-increasing epoch, rejecting rolled-back state.
    manual_test: >-
      restore a stale session/token blob (old backup/snapshot) and confirm the
      app revives the ended/revoked session; verify the secure build validates
      freshness/revocation server-side and rejects the rolled-back state.
    detail: >-
      The app treats a locally-persisted session/token as authoritative and never
      checks freshness or revocation server-side. Restoring an old local state (from
      a backup, snapshot, or copied container) revives an already-ended or revoked
      session, and the app believes the user is still authenticated. On device the
      session blob is persisted to the key-value backing file (SharedPreferences XML
      on Android, a UserDefaults plist on iOS) and resume reads it back from disk, so
      restoring an old adb-pulled/edited file (or rolling back session_epoch) revives
      a revoked session. The secure path validates the session against the current
      server epoch and a revocation list, rejecting rolled-back state while accepting
      the current session.
