    tools:
    - objection
    - frida
    tools_android:
    - adb
    tools_ios:
    - idb
    - idevicesyslog
    summary: Copies passwords/tokens to the global clipboard readable by any app.
    manual_test: >-
      copy a sensitive field, then read the clipboard from a second app / `adb
      shell` and confirm the secret is present.
    detail: >-
      The password or token is copied to the shared system clipboard with no
      sensitivity flag and no auto-clear. On Android any app can read the clipboard
      (pre-10) or it appears in clipboard history; on iOS it is exposed to the
      universal pasteboard. Secrets should never touch the global clipboard.
    references:
    - CVE-2026-17766 (Android Chrome clipboard cross-origin data leak)|https://nvd.nist.gov/vuln/detail/CVE-2026-17766
  - id: screenshot_taskswitcher_leakage
    title: Screenshot / Task-Switcher Leakage
    difficulty: easy
