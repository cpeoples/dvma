    cwe:
    - CWE-532
    tools: []
    tools_android:
    - adb logcat
    tools_ios:
    - idevicesyslog
    - Console.app
    summary: PII, tokens, and passwords printed to system logs.
    manual_test: >-
      `adb logcat` / `idevicesyslog` while using the app; confirm PII/tokens
      are logged.
    detail: >-
      The login handler writes the username, plaintext password, and auth token
      straight to the system log (Logcat on Android, the unified log on iOS). This
      emits a log line that anyone with the system-log reader (adb logcat on
      Android, idevicesyslog/Console on iOS) can harvest with zero effort.
  - id: keyboard_cache_autofill_leakage
    title: Keyboard Cache & Autofill Leakage
    difficulty: medium
    masvs:
    - MASVS-STORAGE-2
    mastg_v2:
    - MASTG-TEST-0258
    - MASTG-TEST-0313
    - MASTG-TEST-0314
    mastg_demo:
    - MASTG-DEMO-0064
    - MASTG-DEMO-0076
    - MASTG-DEMO-0077
    maswe:
    - MASWE-0036
    owasp_mobile: M9
    cwe:
    - CWE-524
    tools: []
    tools_android:
    - adb
    - run-as
    - SharedPreferences/XML inspection
    tools_ios:
    - ifuse
    - afcclient
    - plutil
    - plist inspection
    summary: Sensitive text fields allow keyboard caching / autofill of secrets.
    manual_test: >-
      type into a sensitive field, then inspect the IME's
      personalized-dictionary / autofill cache and confirm the secret was
      retained (field not marked no-suggestions / no-autofill).
    detail: >-
      This secret field leaves autocorrect and suggestions ON and is not obscured,
      so what the user types is eligible to be learned by the keyboard (personal
      dictionary / next-word model, later autofilled in other apps) and, because
      the window is not FLAG_SECURE, captured into the recents thumbnail. The
      misconfigured field is the real artifact; the probe reports only the field's
      actual configuration flags and the real window screenshot posture, not
      invented dictionary entries. A secure field would set obscureText:true,
      autocorrect:false, and enableSuggestions:false.
  - id: temp_file_leftovers
    title: Temp / Cache File Leftovers
    difficulty: medium
    masvs:
    - MASVS-STORAGE-1
    mastg_v2:
    - MASTG-TEST-0207
    - MASTG-TEST-0299
    - MASTG-TEST-0302
    mastg_demo:
    - MASTG-DEMO-0010
    maswe:
    - MASWE-0001
    owasp_mobile: M9
    cwe:
    - CWE-459
    - CWE-312
    tools:
    - objection
    tools_android:
    - adb
    - run-as
    tools_ios:
    - ifuse
    - afcclient
    summary: Decrypted/sensitive content written to temp/cache dirs and never cleaned up.
    manual_test: >-
      browse the app cache/temp dirs and confirm sensitive leftovers.
    detail: >-
      An export/decrypt flow writes the decrypted, sensitive content to a
      predictable temp file in cleartext and never deletes it. This writes a file
      into the app temp/cache directory on-device; the leftover survives after use
      and is recoverable via adb or a rooted/jailbroken device, a file browser, or
      forensic tooling.
  - id: third_party_sdk_data_leakage
    title: Third-Party SDK Data Leakage
    difficulty: medium
