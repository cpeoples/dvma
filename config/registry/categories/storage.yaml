    - adb shell screenrecord
    - scrcpy
    tools_ios:
    - idevicescreenshot
    - QuickTime screen recording
    summary: Sensitive screen rendered into the app-switcher snapshot with no FLAG_SECURE.
    manual_test: >-
      background the app on a sensitive screen and inspect the task-switcher
      snapshot.
    detail: >-
      This sensitive screen does not set FLAG_SECURE (Android) and does not blur its
      iOS snapshot, so it is eligible to be captured into the recents
      (task-switcher) thumbnail when the app is backgrounded, readable by anyone
      with the device or via a recents screenshot. A researcher can confirm the
      posture with the FLAG_SECURE probe and by opening the app switcher; setting
      FLAG_SECURE / setRecentsScreenshotEnabled(false) would hide the thumbnail. The
      offline model still tracks the background/foreground state when the native
      probe is unavailable.
  - id: sensitive_data_in_logs
