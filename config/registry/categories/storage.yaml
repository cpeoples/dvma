# DVMA registry category: storage
# Append new modules here, then run: dart run tool/generate.dart

storage:
  title: Insecure Data Storage
  owasp_mobile: M9
  description: 'Sensitive data persisted without protection: plaintext key-value stores, misused Keychain/Keystore, backup leakage, clipboard, screenshots, logs, keyboard cache, temp files, and over-sharing third-party SDKs.'
  vulnerabilities:
  - id: insecure_local_storage
    title: Insecure Local Storage (Plaintext SharedPreferences/UserDefaults)
    difficulty: easy
    masvs:
    - MASVS-STORAGE-1
    mastg_v2:
    - MASTG-TEST-0287
    - MASTG-TEST-0300
    - MASTG-TEST-0301
    - MASTG-TEST-0302
    mastg_demo:
    - MASTG-DEMO-0059
    maswe:
    - MASWE-0001
    owasp_mobile: M9
    cwe:
    - CWE-312
    - CWE-922
    display_tags:
    - CWE-312
    - MASVS-STORAGE-1
    tools:
    - objection
    tools_android:
    - adb
    - run-as
    - SharedPreferences/XML inspection
    - sqlite3
    tools_ios:
    - objection
    - ifuse
    - afcclient
    - plutil
    - plist inspection
    summary: Auth token and PII written to SharedPreferences/UserDefaults in cleartext.
    manual_test: >-
      pull `shared_prefs/*.xml` (Android) or the app's `NSUserDefaults` plist
      (iOS) via `adb`/objection and confirm the token/SSN/card are cleartext.
    detail: >-
      Sensitive values are written to the local key-value store (SharedPreferences
      on Android, UserDefaults on iOS) as cleartext. Via adb on a rooted or
      jailbroken device, the key-value backing file
      (SharedPreferences XML on Android, a UserDefaults plist on iOS) exposes
      everything. The secure path keeps such values in app-private, encrypted
      storage rather than the plaintext key-value store.
  - id: keychain_keystore_misuse
    platform_note: Android Keystore/EncryptedSharedPreferences; iOS Keychain (kSecAttr* accessibility).
    title: Keychain/Keystore Misuse
    difficulty: medium
    masvs:
    - MASVS-STORAGE-1
    - MASVS-CRYPTO-2
    mastg_v2:
    - MASTG-TEST-0287
    - MASTG-TEST-0300
    - MASTG-TEST-0301
    mastg_demo:
    - MASTG-DEMO-0059
    maswe:
    - MASWE-0003
    owasp_mobile: M9
    cwe:
    - CWE-312
    - CWE-522
    display_tags:
    - CWE-522
    - MASVS-STORAGE-1
    - MASVS-CRYPTO-2
    tools:
    - objection
    - frida
    - r2frida
    tools_android:
    - adb
    - run-as
    - KeyStore inspection
    - jadx
    tools_ios:
    - objection
    - keychain-dumper
    - plutil
    summary: Secrets stored without hardware-backed protection / with weak accessibility flags.
    manual_test: >-
      dump the Keychain with objection / `keychain-dumper` and confirm weak
      accessibility / no hardware backing.
    detail: >-
      The secret is stored in the platform secret store with the weakest
      accessibility class (kSecAttrAccessibleAlways / no user-auth, no hardware
      backing). On device the value lands in the local key-value store
      (SharedPreferences on Android, UserDefaults on iOS) in cleartext, so it is
      readable while the device is locked, is copied into backups, and is
      recoverable via adb or a rooted/jailbroken device. The stronger exploit is
      platform-level (keychain-dumper / frida); the weak flags and the missing
      auth gate are the faithful core of the finding.
    references:
    - CVE-2026-28864 (iOS Keychain authorization bypass - access to another user's items)|https://support.apple.com/en-euro/126792
  - id: insecure_backups
    title: Insecure Backups (allowBackup / unencrypted iOS backups)
    difficulty: easy
    masvs:
    - MASVS-STORAGE-2
    mastg_v2:
    - MASTG-TEST-0216
    - MASTG-TEST-0215
    - MASTG-TEST-0262
    - MASTG-TEST-0298
    mastg_demo:
    - MASTG-DEMO-0020
    - MASTG-DEMO-0035
    maswe:
    - MASWE-0006
    owasp_mobile: M9
    cwe:
    - CWE-530
    tools: []
    tools_android:
    - adb backup
    - apktool
    tools_ios:
    - idevicebackup2
    - ifuse
    - plist inspection
    summary: android:allowBackup=true and no iOS backup exclusion leak app data to backups.
    manual_test: >-
      run `adb backup` (or a Finder/iMazing backup) and confirm app data is
      recoverable from the backup.
    detail: >-
      android:allowBackup=true with no backup rules (and no iOS
      NSURLIsExcludedFromBackupKey) means a full device backup captures the whole
      app sandbox: tokens, databases, and PII. The app writes a JSON blob of
      tokens and PII into the app documents directory, which is part of the sandbox
      a backup sweeps up, so the real exploit is a full device backup pulling
      exactly this file. The secure path excludes sensitive files from backup and
      disables unconditional backup of the sandbox.
  - id: clipboard_leakage
    title: Clipboard Leakage of Sensitive Fields
    difficulty: easy
    masvs:
    - MASVS-STORAGE-2
    mastg_v2:
    - MASTG-TEST-0276
    - MASTG-TEST-0277
    - MASTG-TEST-0278
