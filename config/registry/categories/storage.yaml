    - Burp Suite
    - Wireshark
    - MobSF
    summary: A stand-in analytics SDK phones home more data than its stated purpose.
    manual_test: >-
      proxy traffic with mitmproxy and confirm the SDK exfiltrates more than
      its stated purpose.
    detail: >-
      A bundled analytics SDK claims to just count screen views, but every event it
      sends to its endpoint is enriched with email, ad/device IDs, precise
      location, installed apps, and contact counts, none of which the feature
      needs. A pentester sees this in mitmproxy.
  - id: sensitive_data_in_memory
    title: Sensitive Data in Memory
    difficulty: hard
    masvs:
    - MASVS-STORAGE-1
    mastg_v2:
    - MASTG-TEST-0011
    - MASTG-TEST-0060
    maswe:
    - MASWE-0001
    owasp_mobile: M9
    cwe:
    - CWE-316
    - CWE-226
    tools:
    - objection
    - frida
    - r2frida
    tools_android:
    - gdb
    tools_ios:
    - lldb
    summary: Passwords/keys are held in long-lived, never-cleared objects, recoverable from a process memory dump.
    manual_test: >-
      dump the process memory (fridump / objection / gdb) and recover the
      retained password/key.
    detail: >-
      The password and symmetric key are copied into a process-global,
      never-cleared store when used. Because those objects stay reachable for the
      life of the process, a heap/memory dump (fridump, objection, gdb/lldb)
      recovers the plaintext long after the login flow finished. A secure
      implementation holds the secret only for the duration of a use and zeroizes
      its buffer immediately after.
