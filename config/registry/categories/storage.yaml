  - id: sensitive_data_in_crash_reports
    platforms:
    - android
    - ios
    platform_note: Crashlytics/Sentry/os_log crash diagnostics and native tombstones/.ips reports.
    title: Sensitive Data in Crash Reports
    difficulty: easy
    masvs:
    - MASVS-STORAGE-1
    - MASVS-PRIVACY-1
    maswe:
    - MASWE-0005
    owasp_mobile: M9
    cwe:
    - CWE-200
    - CWE-532
    - CWE-201
    display_tags:
    - CWE-200
    - CWE-532
    - MASVS-STORAGE-1
    tools:
    - mitmproxy
    tools_android:
    - adb logcat
    tools_ios:
    - Console.app
    - idevicesyslog
    attack_inputs:
    - triggered crash
    summary: 'Secrets, tokens, PII, or full request/response bodies survive into crash / diagnostic reports (Crashlytics/Sentry breadcrumbs, exception messages, attached state, native tombstones) that are written locally and shipped to a third-party crash service, exposing data the developer assumed stayed in memory. Distinct from ordinary logging: the crash pipeline captures and EXFILTRATES app state on failure. The secure path scrubs/allowlists crash payloads.'
    manual_test: >-
      trigger a crash and confirm the crash payload shipped to the crash
      service contains secrets/PII/request bodies; verify the secure build
      scrubs/allowlists the crash payload before sending.
    detail: >-
      When the app crashes, the diagnostics pipeline snapshots the current
      application state and recent breadcrumbs, then ships that report to a
      third-party crash service. Developers assume the auth token, the password,
      and the last request body only ever lived in memory, but the crash reporter
      captures and exfiltrates exactly that state on failure. The raw crash report
      (stack trace, breadcrumbs, token/PII) is emitted to the system log and the
      evidence sink, so the system-log reader (adb logcat on Android,
      idevicesyslog/Console on iOS) captures exactly what a real crash upload would
      have shipped. The secure path allowlists non-sensitive fields, redacts
      tokens/PII, and drops request/response bodies before uploading.
    references:
    - 'OWASP MASTG: sensitive data in logs / diagnostics|https://mas.owasp.org/MASTG/techniques/ios/MASTG-TECH-0066/'
