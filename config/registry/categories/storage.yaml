    summary: Writes sensitive files to shared/external storage where any app with storage access can read them.
    manual_test: >-
      read the app's file from shared / external storage with a second app or
      `adb`.
    detail: >-
      The secret is written as a cleartext file into shared / external storage. On a
      real device, external storage is world-readable to any app with storage
      access (and to adb or any file-manager app), so the file leaks the moment it
      is written; on Android it goes into the external files directory, elsewhere
      into app documents. Sensitive data must stay in app-private, encrypted
      storage.
  - id: keychain_state_integrity_manipulation
    platforms:
    - ios
    title: Keychain State Integrity Manipulation
    difficulty: hard
    masvs:
    - MASVS-STORAGE-1
    - MASVS-CRYPTO-2
    mastg_v2:
    - MASTG-TEST-0387
    - MASTG-TEST-0338
    mastg_demo:
    - MASTG-DEMO-0150
    - MASTG-DEMO-0101
    maswe:
    - MASWE-0001
    owasp_mobile: M9
    cwe:
    - CWE-345
    - CWE-565
    - CWE-472
    display_tags:
    - CWE-345
    - CWE-565
    - MASVS-STORAGE-1
    tools:
    - objection
    - frida
    - r2frida
    - keychain-dumper
    - plutil
    - xxd
    summary: The app TRUSTS a Keychain/Keystore item as authoritative but a local attacker can MODIFY that stored state (not merely read it), so tampering with the item alters what the app authorizes or trusts - an integrity/state-manipulation failure distinct from secret confidentiality (iOS Keychain state-modification CVE-2026-28860 class).
    manual_test: >-
      modify a Keychain/Keystore item the app treats as authoritative (e.g. a
      trust flag/signing key) and confirm the app acts on the tampered value;
      verify the secure build verifies an integrity tag/attestation and
      rejects it (iOS Keychain state-modification CVE-2026-28860 class).
    detail: >-
      The app treats a Keychain/Keystore item as an authoritative source of truth
      and acts on it, granting an admin privilege, with no integrity check. A local
      attacker who can modify the stored item (not merely read it) rewrites the
      entitlement blob to "role=admin" and is silently escalated. This is an
      integrity/state-manipulation failure distinct from secret confidentiality
      (iOS Keychain state-modification CVE-2026-28860 class). On device the trusted
      entitlement blob and its weak integrity tag are persisted to a
      Keychain/UserDefaults item, so a local attacker can edit the value via a
      device backup or a jailbroken device. The secure path recomputes and verifies
      the MAC over the stored value and rejects the tampered item.
    references:
    - CVE-2026-28860 (iOS local attacker can modify Keychain state)|https://support.apple.com/en-euro/126792
  - id: keychain_access_group_authorization_confusion
    platforms:
    - ios
    title: Keychain Access-Group Authorization Confusion
    difficulty: hard
    masvs:
    - MASVS-STORAGE-1
    - MASVS-AUTH-1
    mastg_v2:
    - MASTG-TEST-0388
    maswe:
    - MASWE-0001
    owasp_mobile: M9
    cwe:
    - CWE-522
    - CWE-284
    - CWE-668
    display_tags:
    - CWE-522
    - CWE-284
    - MASVS-STORAGE-1
    tools:
    - objection
    - frida
    - r2frida
    - keychain-dumper
    - codesign
    summary: Over-broad kSecAttrAccessGroup / a shared access group / synchronizable or wrongly-scoped accessibility flags let another app, extension, or user read Keychain items that should be isolated to this app, so items leak across the intended authorization boundary (iOS Keychain access-authorization CVE-2026-28864 class).
    manual_test: >-
      from a different access group / extension read items stored under an
      over-broad or wildcard `kSecAttrAccessGroup` and confirm cross-group
      access; verify the secure build scopes items to an exact app-private
      group and refuses the read (iOS Keychain authorization CVE-2026-28864
      class).
    detail: >-
      A sensitive keychain item is scoped to an access group that is too broad to
      isolate it, and marked synchronizable, so a different app or extension can
      still read an item that should be private to the owning app. This is an
      authorization confusion at the access-group boundary, distinct from weak
      item-accessibility misuse. The in-app model shows the extreme case (a
      shared/wildcard group served to any caller); on a real iOS device the same
      confusion is reproduced with Security.framework by storing the secret
      synchronizable and NOT scoped to an app-private access group (so it lands in
      the default app+extensions group), then reading it back across the boundary
      via SecItemAdd / SecItemCopyMatching. On device the secret is also persisted
      to a Keychain/UserDefaults item, recoverable in cleartext from an unencrypted
      device backup or a jailbroken device (SSH/SCP or Filza; keychain-dumper). The
      secure path rejects the over-broad stored group and requires an exact
      app-private access-group match, refusing cross-group reads.
    references:
    - CVE-2026-28864 (iOS Keychain authorization bypass - cross-user item access)|https://support.apple.com/en-euro/126792
  - id: backup_archive_integrity_tampering
    platforms:
    - android
    - ios
    platform_note: Android Auto Backup / adb backup archives; iOS iTunes/Finder & iCloud backups. Restore path is the boundary.
    title: Backup Archive Integrity Tampering
    difficulty: hard
    masvs:
    - MASVS-STORAGE-2
    - MASVS-RESILIENCE-3
    mastg_v2:
    - MASTG-TEST-0338
    - MASTG-TEST-0387
    mastg_demo:
    - MASTG-DEMO-0101
    - MASTG-DEMO-0150
    maswe:
    - MASWE-0006
    owasp_mobile: M9
    cwe:
    - CWE-345
    - CWE-565
    - CWE-494
    display_tags:
    - CWE-345
    - CWE-494
    - MASVS-STORAGE-2
    tools:
    - sqlite3
    - xxd
    tools_android:
    - adb backup
    - apktool
    tools_ios:
    - idevicebackup2
    - plutil
    attack_inputs:
    - tampered backup archive
    summary: 'The app does not verify the INTEGRITY of a backup archive before restoring it, so an attacker extracts a backup, edits persisted state (entitlements, balances, feature flags, an is_premium/is_admin bit), re-packs it, and restores - and the app trusts the attacker-controlled state. This is the integrity direction of backups (not the read/leak direction): the restore path is the boundary (unsigned-backup tampering CVE-2025-49199 class, OWASP MASTG-BEST-0065).'
    manual_test: >-
      pull a backup, flip a persisted flag (e.g. `is_premium`/`is_admin`) or a
      balance, re-pack, restore, and confirm the app trusts the tampered
      state; verify the secure build verifies a keyed MAC over the archive and
      rejects it (CVE-2025-49199, MASTG-BEST-0065).
    detail: >-
      The app restores a backup archive of persisted state without verifying its
      integrity. An attacker extracts the backup, edits security-relevant state
      (flips is_premium false to true, sets is_admin, raises the account balance),
      re-packs it, and restores, and the restore path applies the
      attacker-controlled state verbatim. On device the archive is written to a
      real file in the app documents container (swept up by a full device backup,
      recoverable from the device via adb-pullable, or via backup/jailbreak on iOS,
      and editable), and the unverified restore reads it back from disk. The secure
      path recomputes a keyed MAC over the archive and refuses any archive whose tag
      does not verify, while still accepting the genuine backup.
    references:
    - CVE-2025-49199 (unsigned backup archive modified and re-uploaded)|https://nvd.nist.gov/vuln/detail/CVE-2025-49199
    - 'OWASP MASTG-BEST-0065: implementing storage integrity checks|https://mas.owasp.org/MASTG/best-practices/MASTG-BEST-0065/'
  - id: local_security_state_integrity_tampering
    platforms:
    - android
    - ios
    platform_note: SharedPreferences/SQLite (Android) or UserDefaults/plist/SQLite (iOS) that gate a security decision.
    title: Local Security-State Integrity Tampering
    difficulty: medium
    masvs:
    - MASVS-STORAGE-2
    - MASVS-AUTH-1
    mastg_v2:
    - MASTG-TEST-0338
    - MASTG-TEST-0387
    mastg_demo:
    - MASTG-DEMO-0101
    - MASTG-DEMO-0150
    maswe:
    - MASWE-0006
    owasp_mobile: M9
    cwe:
    - CWE-565
    - CWE-345
    - CWE-602
    display_tags:
    - CWE-565
    - CWE-602
    - MASVS-STORAGE-2
    tools:
    - sqlite3
    - xxd
    tools_android:
    - adb
    - SharedPreferences/XML inspection
    tools_ios:
    - objection
    - plutil
    - plist inspection
    attack_inputs:
    - edited preference/db value
    summary: A security decision (authenticated?, role, jailbreak-check result, purchase entitlement) is driven by a locally-persisted value in UserDefaults/SharedPreferences/SQLite that carries no integrity protection, so an attacker with local access flips the value and the app trusts it - no secret is stolen, the app is made to trust attacker-controlled STATE. The secure path binds security state to a keyed MAC / server authority (OWASP MASTG-BEST-0065 storage-integrity class).
    manual_test: >-
      edit a UserDefaults / SharedPreferences / SQLite value that gates a
      security decision (role / entitlement) and confirm the app trusts it;
      verify the secure build binds the value to a keyed MAC / server
      authority and rejects the edit.
    detail: >-
      A security decision (role, purchase entitlement) is read straight from a
      locally-persisted value that carries no integrity protection. An attacker with
      local access flips the stored value (role=admin, entitlement=premium) and the
      app trusts it; no secret is stolen, the app is simply made to trust
      attacker-controlled state. The state is persisted to an on-device SQLite
      database, so it can be pulled via adb or a rooted/jailbroken device and edited
      with sqlite3. The secure path binds each value to a keyed MAC and fails closed
      when the tag does not verify, while still honoring legitimately-written state.
    references:
    - 'OWASP MASTG-BEST-0065: implementing storage integrity checks|https://mas.owasp.org/MASTG/best-practices/MASTG-BEST-0065/'
  - id: auth_state_rollback_restore
    platforms:
    - android
    - ios
    platform_note: Restoring a stale local session/token blob (backup, snapshot, copied container) revives an old auth state.
    title: Authentication-State Rollback / Restore
    difficulty: medium
    masvs:
    - MASVS-AUTH-1
    - MASVS-STORAGE-2
    mastg_v2:
    - MASTG-TEST-0338
    - MASTG-TEST-0387
    mastg_demo:
    - MASTG-DEMO-0101
    - MASTG-DEMO-0150
    maswe:
