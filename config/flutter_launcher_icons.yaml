# flutter_launcher_icons configuration for DVMA.
# Centralized here under config/. To (re)generate launcher icons run:
#   dart run flutter_launcher_icons -f config/flutter_launcher_icons.yaml
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/dvma_icon.png"
  min_sdk_android: 21
  # Android adaptive icon: dark green-black background + the mark in the
  # foreground, matching the DVMA design system.
  adaptive_icon_background: "#0D1210"
  adaptive_icon_foreground: "assets/branding/dvma_icon_foreground.png"
