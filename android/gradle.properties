org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Android SDK levels - single source of truth
# Centralized here (idiomatic Gradle) instead of hardcoding in build.gradle.kts,
# so compileSdk lives in exactly one place. compileSdk is pinned (not inherited
# from flutter.compileSdkVersion) because several AndroidX deps pulled in by our
# plugins require compiling against API 33+. minSdk/targetSdk still follow
# Flutter's vended defaults unless overridden below.
dvma.compileSdk=36
