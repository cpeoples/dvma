<svg width="420" height="140" viewBox="0 0 420 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DVMA - Damn Vulnerable Mobile App">
  <title>DVMA - Damn Vulnerable Mobile App</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121A16"/>
      <stop offset="1" stop-color="#0A0F0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="72" cy="74" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#E8A33D" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="72" y1="30" x2="72" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4B85A"/>
      <stop offset="1" stop-color="#D98A24"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded panel so the mark reads correctly on both light and dark backgrounds. -->
  <rect x="0" y="0" width="420" height="140" rx="18" fill="url(#panel)"/>
  <rect x="1" y="1" width="418" height="138" rx="17" fill="none" stroke="#2A3630" stroke-width="1.5"/>

  <!-- Hero mark: phone outline + hazard triangle breaking out (matches the app icon). -->
  <rect x="8" y="6" width="128" height="128" rx="14" fill="url(#glow)"/>
  <g transform="translate(-5.8,-6.3) scale(0.62)">
    <rect x="82" y="36" width="92" height="150" rx="18" fill="#0F1512" stroke="#4A5A52" stroke-width="3"/>
    <rect x="118" y="46" width="20" height="4" rx="2" fill="#4A5A52"/>
    <path d="M128 92 L188 200 Q193 210 182 210 L74 210 Q63 210 68 200 Z"
          fill="url(#amber)" stroke="#FFCE86" stroke-width="2.5" stroke-opacity="0.7" stroke-linejoin="round"/>
    <rect x="121.5" y="132" width="13" height="38" rx="6.5" fill="#0C110F"/>
    <circle cx="128" cy="188" r="7" fill="#0C110F"/>
  </g>

  <!-- Wordmark -->
  <g>
    <text x="132" y="72" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,monospace" font-size="52" font-weight="700" letter-spacing="2" fill="#F2F6F3">DVMA</text>
    <text x="134" y="100" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,monospace" font-size="15" font-weight="500" letter-spacing="1.5" fill="#A8B6AF">Damn Vulnerable Mobile App</text>
  </g>
</svg>
