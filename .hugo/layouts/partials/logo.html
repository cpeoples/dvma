{{- /*
  Custom sidebar logo: the DVMA hazard icon on top, site title below, centered.
  Overrides the stock Relearn logo.html so the sidebar shows OUR real icon
  (docs/assets/dvma-icon.svg, mirrored to static/images/logo.svg).
*/ -}}
<a id="R-logo"
   class="R-default direction-column"
   href="{{ partial "permalink.gotmpl" (dict "to" site.Home) }}"
   style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:0.5rem;padding:0.75rem 0;">
  <span class="logo-image default-animation">
    <img src="/images/logo.svg"
         alt="DVMA"
         height="56"
         width="56"
         class="nolightbox"
         style="display:block;" />
  </span>
  <span class="logo-title default-animation" style="display:block;">{{ site.Title }}</span>
</a>
