baseURL = "/"
defaultContentLanguage = "en"
title = "DVMA - Damn Vulnerable Mobile App"
theme = "hugo-theme-relearn"

uglyURLs = false
enableGitInfo = true

disableKinds = ["taxonomy", "term"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]

  themeVariant = ["relearn-dark", "relearn-light"]
  themeVariantAuto = ["relearn-dark", "relearn-light"]
  themeVariantDefault = "relearn-dark"

  search = true
  searchMaxResultLength = 20

  # Inline <code> gets a copy button from the theme whenever its text is >5
  # chars, which looks arbitrary on our id/tool lists (e.g. `manual` gets one,
  # `frida` doesn't). Disable it for inline code; code BLOCKS keep their button.
  disableInlineCopyToClipBoard = true

  disableBreadcrumb = false
  disableNextPrev = false

  collapsibleMenu = true
  alwaysopen = false

  externalLinkTarget = "_blank"

  sidebarmenus = [
    { type = "page", identifier = "main", disableTitle = true, pageRef = "/" },
    { type = "menu", identifier = "shortcuts", disableTitle = true }
  ]

  customCSS = ["css/custom.css"]

  showVisitedLinks = false
  print = true
  printPageBreak = true

  [params.author]
    name = "Chris Peoples"

[[menu.shortcuts]]
  pre = '<i class="fa-fw fab fa-github"></i> '
  name = "GitHub Repo"
  url = "https://github.com/cpeoples/dvma"
  weight = 10

[[menu.shortcuts]]
  pre = '<i class="fa-fw fas fa-book"></i> '
  name = "OWASP MASVS"
  url = "https://mas.owasp.org/MASVS/"
  weight = 20

[markup]
  [markup.highlight]
    codeFences = true
    lineNos = true
    lineNumbersInTable = true
    style = "monokai"
    noClasses = false

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true
      title = true
