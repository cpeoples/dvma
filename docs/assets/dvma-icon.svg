<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DVMA icon">
  <title>DVMA icon</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121A16"/><stop offset="1" stop-color="#0A0F0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="150" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.30"/>
      <stop offset="0.62" stop-color="#E8A33D" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="128" y1="70" x2="128" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4B85A"/><stop offset="1" stop-color="#D98A24"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <rect x="6" y="6" width="244" height="244" rx="50" fill="none" stroke="#2A3630" stroke-width="2"/>
  <rect width="256" height="256" rx="56" fill="url(#glow)"/>
  <!-- phone outline -->
  <rect x="82" y="36" width="92" height="150" rx="18" fill="#0F1512" stroke="#4A5A52" stroke-width="3"/>
  <rect x="118" y="46" width="20" height="4" rx="2" fill="#4A5A52"/>
  <!-- filled hazard triangle breaking out past the bottom of the phone -->
  <path d="M128 92 L188 200 Q193 210 182 210 L74 210 Q63 210 68 200 Z"
        fill="url(#amber)" stroke="#FFCE86" stroke-width="2.5" stroke-opacity="0.7" stroke-linejoin="round"/>
  <rect x="121.5" y="132" width="13" height="38" rx="6.5" fill="#0C110F"/>
  <circle cx="128" cy="188" r="7" fill="#0C110F"/>
</svg>
