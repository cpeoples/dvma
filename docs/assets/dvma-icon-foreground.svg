<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DVMA adaptive foreground">
  <title>DVMA adaptive foreground</title>
  <defs>
    <radialGradient id="glow" cx="512" cy="560" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.30"/>
      <stop offset="0.62" stop-color="#E8A33D" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="512" y1="300" x2="512" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4B85A"/><stop offset="1" stop-color="#D98A24"/>
    </linearGradient>
  </defs>
  <!-- transparent background; Android supplies the tile color. Mark sits inside the ~66% safe zone. -->
  <circle cx="512" cy="560" r="290" fill="url(#glow)"/>
  <!-- E composition (phone outline + triangle breaking out), scaled ~1.85 and centered -->
  <g transform="translate(279.8,284.5) scale(1.85)">
    <rect x="82" y="36" width="92" height="150" rx="18" fill="#0F1512" stroke="#4A5A52" stroke-width="3"/>
    <rect x="118" y="46" width="20" height="4" rx="2" fill="#4A5A52"/>
    <path d="M128 92 L188 200 Q193 210 182 210 L74 210 Q63 210 68 200 Z"
          fill="url(#amber)" stroke="#FFCE86" stroke-width="2.5" stroke-opacity="0.7" stroke-linejoin="round"/>
    <rect x="121.5" y="132" width="13" height="38" rx="6.5" fill="#0C110F"/>
    <circle cx="128" cy="188" r="7" fill="#0C110F"/>
  </g>
</svg>
